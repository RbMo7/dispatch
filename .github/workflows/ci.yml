name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline:
    # Everything except the live-chain tests (devnet / Base Sepolia), which
    # spend testnet funds and run locally instead (ADR-0013, ADR-0040).
    name: typecheck, lint, offline + Postgres tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dispatch
          POSTGRES_PASSWORD: dispatch
          POSTGRES_DB: dispatch
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dispatch"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://dispatch:dispatch@localhost:5432/dispatch
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:offline
      # The Signer is its own package (ADR-0002). Installed after the root
      # lint, so that lint keeps proving it resolves without the Signer's deps.
      - run: pnpm --dir signer install --frozen-lockfile
      - run: pnpm --dir signer typecheck
      - run: pnpm --dir signer test
