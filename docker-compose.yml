x-database-url: &database-url postgres://dispatch:dispatch@postgres:5432/dispatch
x-signer-url: &signer-url http://signer:8421

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dispatch
      POSTGRES_PASSWORD: dispatch
      POSTGRES_DB: dispatch
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dispatch']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    command: ['node', 'dist/index.js']
    environment:
      PORT: 8420
      DATABASE_URL: *database-url
      SIGNER_URL: *signer-url
    ports:
      - '8420:8420'
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build: .
    command: ['node', 'dist/worker.js']
    environment:
      DATABASE_URL: *database-url
      SIGNER_URL: *signer-url
    depends_on:
      postgres:
        condition: service_healthy

  signer:
    # Reference/dev-only local-keyfile Signer (ADR-0002) — never imported by the engine itself.
    build:
      context: .
      dockerfile: reference-signer/Dockerfile
    environment:
      PORT: 8421
    ports:
      - '8421:8421'

volumes:
  postgres-data:
