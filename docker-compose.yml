x-database-url: &database-url postgres://dispatch:dispatch@postgres:5432/dispatch

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dispatch
      POSTGRES_PASSWORD: dispatch
      POSTGRES_DB: dispatch
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dispatch']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    command: ['node', 'dist/index.js']
    environment:
      PORT: 8420
      DATABASE_URL: *database-url
    ports:
      - '8420:8420'
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build: .
    command: ['node', 'dist/worker.js']
    environment:
      DATABASE_URL: *database-url
    depends_on:
      postgres:
        condition: service_healthy

  signer:
    # Placeholder only — the reference local-keyfile Signer is built out in issue 04 (ADR-0002).
    image: alpine:3.20
    command: ['sh', '-c', "echo 'signer placeholder - not yet implemented' && sleep infinity"]

volumes:
  postgres-data:
