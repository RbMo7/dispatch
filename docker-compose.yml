# CONTAINER_DATABASE_URL (written by `pnpm dispatch init` for a database of your own) replaces Compose's Postgres.
x-database-url: &database-url ${CONTAINER_DATABASE_URL:-postgres://dispatch:dispatch@postgres:5432/dispatch}
x-signer-url: &signer-url http://signer:8421
# Engine and Signer share one bearer token (ADR-0046), read from .env; `pnpm dispatch init` generates it.
# Without one, both fall back to the dev-only token: never use that in a real deployment.
x-signer-auth-token: &signer-auth-token ${SIGNER_AUTH_TOKEN:-dev-only-signer-token}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dispatch
      POSTGRES_PASSWORD: dispatch
      POSTGRES_DB: dispatch
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dispatch']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    command: ['node', 'dist/index.js']
    # Chain, auth and RPC settings (.env.example); the lines below override what they must.
    env_file:
      - path: .env
        required: false
    environment:
      PORT: 8420
      DATABASE_URL: *database-url
      # ADR-0059: the API never calls the Signer, so it gets no Signer settings, even from .env.
      SIGNER_URL: ''
      SIGNER_AUTH_TOKEN: ''
    ports:
      - '8420:8420'
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build: .
    command: ['node', 'dist/worker.js']
    # Chain, auth and RPC settings (.env.example); the lines below override what they must.
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: *database-url
      SIGNER_URL: *signer-url
      SIGNER_AUTH_TOKEN: *signer-auth-token
    depends_on:
      postgres:
        condition: service_healthy

  signer:
    # The Signer (ADR-0002), never imported by the engine itself. Without
    # `pnpm dispatch init` it signs with the committed dev keys (keyfile
    # backend). init writes signer/local/signer.config.json, its keystore
    # beside it, and SIGNER_CONFIG in .env pointing here at that file.
    build:
      context: .
      dockerfile: signer/Dockerfile
    environment:
      PORT: 8421
      SIGNER_AUTH_TOKEN: *signer-auth-token
      SIGNER_CONFIG: ${SIGNER_CONFIG:-/app/signer.config.dev.json}
      SIGNER_KEYFILE: /app/keys.dev.json
      SIGNER_KEYSTORE_DIR: /app/local/keystore
      # Taken from the shell that runs `docker compose`, never from a file:
      # the local backend's passphrase, and the privy and aws-kms credentials.
      SIGNER_KEYSTORE_PASSPHRASE:
      PRIVY_APP_ID:
      PRIVY_APP_SECRET:
      PRIVY_AUTHORIZATION_KEY:
      AWS_REGION:
      AWS_ACCESS_KEY_ID:
      AWS_SECRET_ACCESS_KEY:
      AWS_SESSION_TOKEN:
    volumes:
      - ./signer/local:/app/local:ro
    ports:
      - '8421:8421'

volumes:
  postgres-data:
