  /v1/assets:
    get:
      tags: [Assets]
      operationId: listAssets
      summary: List Known Assets
      description: |
        Returns every Known Asset, enabled or not: each chain's native coin first, then its tokens by
        symbol. Either token can read. A `payment` item may name the `symbol` of any enabled asset on
        its chain; any other asset is refused with `UNKNOWN_ASSET`.

        `source: config` rows come from `SOLANA_KNOWN_TOKENS`, `BASE_KNOWN_TOKENS` and the native
        coins, and are written at startup. `source: console` rows were added through Add a Known
        Asset. A disabled asset is kept, so past payments in it still show their decimals.
      security:
        - apiToken: []
        - operatorToken: []
      parameters:
        - name: chain
          in: query
          required: false
          description: Only this chain's assets.
          schema: { $ref: '#/components/schemas/Chain' }
          examples:
            baseAssets: { value: base }
      responses:
        '200':
          description: The assets.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [assets]
                properties:
                  assets:
                    type: array
                    items: { $ref: '#/components/schemas/KnownAsset' }
              examples:
                baseAssets:
                  summary: Base, with two tokens added from the console
                  value:
                    assets:
                      - id: 90f91669-f845-45bf-b44a-d571ac098032
                        chain: base
                        address: native
                        symbol: ETH
                        name: Ether
                        decimals: 18
                        kind: native
                        source: config
                        enabled: true
                        addedBy: null
                        addedAt: '2026-11-01T15:44:24.221Z'
                      - id: f1c40b26-3c95-44a8-a06b-5bc06b5272dd
                        chain: base
                        address: '0xB6501Ccdcd1c2aA6C63AF2975f38fE5B58c73027'
                        symbol: LUSD
                        name: Live Dollar
                        decimals: 6
                        kind: erc20
                        source: console
                        enabled: true
                        addedBy: operator
                        addedAt: '2026-11-01T15:45:08.074Z'
                      - id: 4dc99cb4-a219-4b81-9580-45146942c0a1
                        chain: base
                        address: '0x036CbD53842c5426634e7929541eC2318f3dCF7e'
                        symbol: USDC
                        name: USDC
                        decimals: 6
                        kind: erc20
                        source: console
                        enabled: true
                        addedBy: operator
                        addedAt: '2026-11-01T15:47:12.358Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Assets]
      operationId: addAsset
      summary: Add a Known Asset
      description: |
        Makes a token payable on its chain, with no restart. The engine reads the mint or contract
        from the chain: its decimals, name, symbol and supply (an ERC-20's `decimals()`, `name()`,
        `symbol()` and `totalSupply()`; a Solana mint, with its name and symbol from the Token-2022
        metadata extension or the Metaplex metadata account). Decimals are never typed in, since a
        wrong value would scale every amount. Only the operator token can add, and every add is
        written to the activity record, with the `reason` if you give one.

        `symbol` is optional and replaces the chain's symbol: give one when the token publishes none,
        or when its own is already used on the chain. Symbols are unique per chain among enabled
        assets, ignoring case.

        The engine refuses an address that is not a token (`NOT_A_TOKEN`), a Solana mint it can't
        pay out correctly, such as one with a transfer fee or a transfer hook (`NOT_PAYABLE`), and
        an address that is already a Known Asset (`ASSET_EXISTS`). A chain it could not read is a
        `503` with `RPC_UNAVAILABLE`. Both the API and the worker see the new asset on their next
        request.
      security:
        - operatorToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetRequest'
            examples:
              addErc20:
                summary: An ERC-20 that names itself
                value: { chain: base, address: '0xB6501Ccdcd1c2aA6C63AF2975f38fE5B58c73027' }
              notAToken:
                summary: A wallet, not a token
                value: { chain: base, address: '0x7499BC37AcA4f0F4a7A982Afdfea340AfDd74e6A' }
              alreadyKnown:
                summary: A token the engine already knows
                value: { chain: base, address: '0xB6501Ccdcd1c2aA6C63AF2975f38fE5B58c73027' }
      responses:
        '201':
          description: The asset, enabled. Payments may name its `symbol` from now on.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnownAsset'
              examples:
                addErc20:
                  summary: Added
                  value:
                    id: f1c40b26-3c95-44a8-a06b-5bc06b5272dd
                    chain: base
                    address: '0xB6501Ccdcd1c2aA6C63AF2975f38fE5B58c73027'
                    symbol: LUSD
                    name: Live Dollar
                    decimals: 6
                    kind: erc20
                    source: console
                    enabled: true
                    addedBy: operator
                    addedAt: '2026-11-01T15:45:08.074Z'
        '400':
          description: The body is not an asset request, or the address is not a token the engine can pay out.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Error'
                  - $ref: '#/components/schemas/PlainError'
              examples:
                notAToken:
                  summary: No contract at the address
                  value:
                    code: NOT_A_TOKEN
                    message: 0x7499BC37AcA4f0F4a7A982Afdfea340AfDd74e6A has no contract code on this chain
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/OperatorOnly'
        '409':
          description: The address is already a Known Asset, or the symbol is taken on the chain.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                alreadyKnown:
                  summary: Already known
                  value:
                    code: ASSET_EXISTS
                    message: 0xB6501Ccdcd1c2aA6C63AF2975f38fE5B58c73027 is already a Known Asset on base, as LUSD

  /v1/assets/preview:
    post:
      tags: [Assets]
      operationId: previewAsset
      summary: Preview a Known Asset
      description: |
        Reads the address from the chain and answers with what Add a Known Asset would store, plus
        the chain's own name and symbol and the token's supply, or with the same refusal Add would
        give. Nothing is stored or recorded. Takes the same body as Add and the operator token.
      security:
        - operatorToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetRequest'
            examples:
              previewToken2022:
                summary: A Token-2022 mint named in its metadata extension
                value: { chain: solana, address: 4Z2yz3LXTxu8SgTfaLmwjyabgD6PxaZKK97U6RuwMCdJ }
              symbolRequired:
                summary: A mint that publishes no symbol
                value: { chain: solana, address: DmzLGKjKuYb9Sa2aQ6D7nv51ixj8akwDzujYA8wC1Ne4 }
              symbolGiven:
                summary: The same mint, with a symbol
                value: { chain: solana, address: DmzLGKjKuYb9Sa2aQ6D7nv51ixj8akwDzujYA8wC1Ne4, symbol: LIVE }
              walletNotToken:
                summary: A wallet, not a mint
                value: { chain: solana, address: 3fJt3SpG7iWcYfo2MnP8b1LaP3eBhzZ57zHBxWSPWoZe }
              symbolTaken:
                summary: A symbol the chain already uses
                value: { chain: solana, address: 4zMMC9srt5Ri5X14GAgXhaHii3GnPAEERYPJgZJDncDU, symbol: sol }
      responses:
        '200':
          description: What adding it would store.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetPreview'
              examples:
                previewToken2022:
                  summary: Name and symbol from the chain
                  value:
                    chain: solana
                    kind: token-2022
                    address: 4Z2yz3LXTxu8SgTfaLmwjyabgD6PxaZKK97U6RuwMCdJ
                    decimals: 6
                    symbol: LEUR
                    name: Live Euro
                    onChain: { symbol: LEUR, name: Live Euro }
                    supply: '1000000000'
                symbolGiven:
                  summary: The symbol given, the chain's empty
                  value:
                    chain: solana
                    kind: spl
                    address: DmzLGKjKuYb9Sa2aQ6D7nv51ixj8akwDzujYA8wC1Ne4
                    decimals: 6
                    symbol: LIVE
                    name: LIVE
                    onChain: { symbol: '', name: '' }
                    supply: '1000000000'
        '400':
          description: The body is not an asset request, the address is not a token the engine can pay out, or a symbol is needed.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Error'
                  - $ref: '#/components/schemas/PlainError'
              examples:
                symbolRequired:
                  summary: No symbol on chain
                  value:
                    code: SYMBOL_REQUIRED
                    message: 'DmzLGKjKuYb9Sa2aQ6D7nv51ixj8akwDzujYA8wC1Ne4 publishes no symbol on chain: give one in symbol'
                walletNotToken:
                  summary: A wallet
                  value:
                    code: NOT_A_TOKEN
                    message: 3fJt3SpG7iWcYfo2MnP8b1LaP3eBhzZ57zHBxWSPWoZe is owned by 11111111111111111111111111111111, not a token program, so it is not a mint
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/OperatorOnly'
        '409':
          description: The address is already a Known Asset, or the symbol is taken on the chain.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                symbolTaken:
                  summary: The native coin's symbol
                  value:
                    code: SYMBOL_TAKEN
                    message: "sol is already solana's native coin on solana: give another symbol in symbol"

  /v1/assets/{id}:
    patch:
      tags: [Assets]
      operationId: updateAsset
      summary: Enable or disable a Known Asset
      description: |
        Disables an asset added from the console, so no new payment can name it, or enables it
        again. Nothing is ever deleted, so past payments keep their decimals, and a payment already
        accepted still goes out. A config row can't be changed here (`CONFIG_ASSET`): edit the
        variable and restart. Enabling is refused while another enabled asset has the symbol
        (`SYMBOL_TAKEN`). Only the operator token can change an asset, and each change is written to
        the activity record, with the `reason` if you give one. Setting what it already is records
        nothing.
      security:
        - operatorToken: []
      parameters:
        - $ref: '#/components/parameters/AssetId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [enabled]
              properties:
                enabled: { type: boolean }
                reason: { type: string, minLength: 1, description: Why, for the activity record. }
            examples:
              disableAsset:
                summary: Pause payouts in a token
                value: { enabled: false, reason: LUSD payouts paused while the treasury rebalances }
              configAsset:
                summary: A configured asset
                value: { enabled: false }
              notFound:
                summary: No such asset
                value: { enabled: false }
      responses:
        '200':
          description: The asset as it now is.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnownAsset'
              examples:
                disableAsset:
                  summary: Disabled
                  value:
                    id: f1c40b26-3c95-44a8-a06b-5bc06b5272dd
                    chain: base
                    address: '0xB6501Ccdcd1c2aA6C63AF2975f38fE5B58c73027'
                    symbol: LUSD
                    name: Live Dollar
                    decimals: 6
                    kind: erc20
                    source: console
                    enabled: false
                    addedBy: operator
                    addedAt: '2026-11-01T15:45:08.074Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/OperatorOnly'
        '404':
          description: No Known Asset has this id. An id that is not a UUID gets the same answer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlainError'
              examples:
                notFound:
                  summary: No such asset
                  value: { error: not found }
        '409':
          description: A config row, or a symbol another enabled asset holds.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                configAsset:
                  summary: A configured asset
                  value:
                    code: CONFIG_ASSET
                    message: 'this asset comes from the configuration (SOLANA_KNOWN_TOKENS, BASE_KNOWN_TOKENS or the native coin): change it there and restart'

  /v1/setup:
    get:
      tags: [Setup]
      operationId: getSetup
      summary: Get the setup checks
      description: |
        Returns the engine's setup checks, the same ones `pnpm dispatch doctor` runs, as this engine
        last ran them. The worker runs its checks (configuration, chain, Signer, Sender and
        multisig) when it starts and every five minutes, and records the latest result of each. The
        API runs its own on every request: the database is reachable and migrated, and the console
        is built. The API never calls the Signer, so the Signer checks are always the worker's.

        `checks` are in `doctor`'s order. A check that runs once per enabled chain, or once per
        Sender, has `chain`, and its `id` ends in `:<chain>`. With a senders file, a Sender check's
        `id` ends in `:<chain>:<sender>` and its title names the Sender, such as
        `Fee balance (refunds on Solana)`. A recorded check for a chain the engine no longer enables is
        left out. No finding holds a secret: a URL is cut down to its host, and a token is named,
        never shown.
      responses:
        '200':
          description: The checks, and how many passed, warned and failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupReport'
              examples:
                signerDown:
                  summary: The worker cannot reach the Signer
                  value:
                    worker: { status: ran, ranAt: '2026-11-01T10:05:00.000Z' }
                    summary: { passed: 2, warnings: 0, problems: 1 }
                    checks:
                      - id: database.migrated
                        area: database
                        title: Migrated
                        ranIn: api
                        ranAt: '2026-11-01T10:07:12.000Z'
                        status: pass
                        finding: every migration is applied
                      - id: signer.reachable
                        area: signer
                        title: Reachable
                        ranIn: worker
                        ranAt: '2026-11-01T10:05:00.000Z'
                        status: fail
                        finding: 'no Signer answered at SIGNER_URL (signer:8421)'
                        fix: { command: docker compose up -d signer }
                      - id: 'sender.fees:solana'
                        area: sender
                        title: Fee balance (Solana)
                        chain: solana
                        ranIn: worker
                        ranAt: '2026-11-01T10:05:00.000Z'
                        status: pass
                        finding: 2.1500 SOL covers the 0.0034 SOL paid in fees in the last 24 hours
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/activity:
    get:
      tags: [Activity]
      operationId: listOperatorActions
      summary: List operator actions
      description: |
        The operator action record, newest first, a page at a time. One entry for every cancel that
        landed, by either token, every release, every Flag Rule create, edit and delete, and every
        Known Asset added, disabled or enabled. Each is
        also written to the engine's log as an `operator action` line. Only the operator token can
        read it.

        The tokens are shared secrets, not identities, so an entry names which token acted, never
        a person. Pass `nextCursor` back as `cursor` until it is `null`.
      security:
        - operatorToken: []
      parameters:
        - name: limit
          in: query
          description: Entries per page.
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
          examples:
            recent: { value: 3 }
        - name: cursor
          in: query
          description: The `nextCursor` of the previous page, passed back as it came.
          schema: { type: string }
          examples:
            badCursor: { value: not-a-cursor }
      responses:
        '200':
          description: One page of operator actions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityPage'
              examples:
                recent:
                  summary: The latest three actions
                  value:
                    actions:
                      - id: 9d0f7a3e-1b6c-4f25-8e47-c2a91d5b6f80
                        at: '2026-11-01T02:44:19.530Z'
                        action: flag_rule_delete
                        targetId: b3c1e0d2-5f4a-4c8e-9a71-2d6f0e8b9c13
                        tokenKind: operator
                        reason: replaced by a daily limit
                      - id: 4a7c2e19-8d3b-4f61-a5e0-7b9c1d2f3e48
                        at: '2026-11-01T02:31:47.052Z'
                        action: release
                        targetId: 3f8e2a61-9c4d-4b7e-8f12-6a5d0c9e4b27
                        tokenKind: operator
                        reason: checked with finance
                      - id: 1e5b8c47-2f9a-4d03-b6e1-8a4c7d9f0b52
                        at: '2026-11-01T02:13:21.950Z'
                        action: cancel
                        targetId: ecf5aff7-d3ce-4c72-92ed-06f910c7b5f2
                        tokenKind: auth
                        reason: duplicate of refund 7730
                    nextCursor: WyIyMDI2LTExLTAxVDAyOjEzOjIxLjk1MFoiLCIxZTViOGM0Ny0yZjlhLTRkMDMtYjZlMS04YTRjN2Q5ZjBiNTIiXQ
        '400':
          description: The cursor is not one this API issued.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/PlainError'
                  - $ref: '#/components/schemas/RequestError'
              examples:
                badCursor:
                  summary: A cursor the API did not issue
                  value: { error: cursor is not one this API issued }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
