  /v1/token:
    get:
      tags: [Activity]
      operationId: getTokenKind
      summary: Name the token
      description: |
        Says which of the engine's two tokens the request carries: `auth` for `AUTH_TOKEN`,
        `operator` for `OPERATOR_TOKEN`. The console reads it at sign-in, so a session with
        `AUTH_TOKEN` hides the operator pages without calling an operator-only route.
      security:
        - apiToken: []
        - operatorToken: []
      responses:
        '200':
          description: The token's kind.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [kind]
                properties:
                  kind:
                    type: string
                    enum: [auth, operator]
              examples:
                apiToken:
                  summary: Signed in with AUTH_TOKEN
                  value: { kind: auth }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/senders:
    get:
      tags: [Senders]
      operationId: listSenders
      summary: List Senders
      description: |
        Returns one entry per Sender, each chain's in the order the senders file lists them: its name,
        whether it is its chain's default, its address and mode, the balances the Funding Check looks
        at, and what the Signer reported about the key the engine signs with. Without a senders file,
        each enabled chain has one Sender, named `default`, and it is the default.

        The API reads balances from the chain itself and keeps the answer for 15 seconds, so polling
        this route costs at most one round of RPC reads per 15 seconds. It never calls the Signer:
        `signerKey` is what the worker last read, at start and every five minutes after, and `readAt`
        says when. A read that fails turns only its own field into `{ "error": "..." }`, and the route
        still answers `200`. [Read Sender balances](./guides/sender-balances.md) shows how to use it
        before you send.
      responses:
        '200':
          description: The Senders, each enabled chain's one or more.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SenderList'
              examples:
