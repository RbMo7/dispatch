openapi: 3.1.0
info:
  title: Dispatch API
  version: '1'
  summary: Send payments, contract calls and signed transactions on Solana and Base, and track each one to an outcome.
  description: |
    The engine's HTTP API. Every `/v1` route needs a bearer token: the engine's API token, or
    its operator token, which the operator-only routes (release, Flag Rule writes, Known Asset
    writes and the activity record) require.
    The reference pages on the docs site are built from this file, and the engine's offline
    tests send each example below to the real routes and check every answer against these schemas.

    Examples are real answers from an engine on Base Sepolia and Solana devnet. Each example has a
    name, and the same name links a request to its answer: the request example `payBase` produces
    the response example `payBase`, under the status it returns.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://localhost:8420
    description: An engine on your machine. Set `PORT` to change the port.
security:
  - apiToken: []
tags:
  - name: Dispatches
    description: |
      A Dispatch is one request to send something on one chain. A Managed Dispatch carries
      payments and contract calls that the engine builds and signs. A Relay Dispatch carries one
      transaction someone else already signed. Every route answers at once: you create a Dispatch,
      then poll it until each item is final.
  - name: Flag Rules
    description: |
      Conditions the operator sets, which every Managed Dispatch is checked against when it is
      submitted. A Dispatch that matches any enabled rule on its chain is stored `held`, and
      nothing is signed, proposed or sent until an operator releases it. Reading rules takes either
      token; writing them takes the operator token.
  - name: Assets
    description: |
      The Known Assets a payment may name on each chain: the native coin, the tokens the operator
      configured, and the tokens added here. Each token's decimals, name and symbol are read from
      the chain, never typed in. Reading takes either token; adding, enabling and disabling take
      the operator token.
  - name: Senders
    description: |
      A Sender is a wallet the engine pays from. Each enabled chain has one or more, each named,
      with its own key, mode, balances and nonces, and at most one per chain is the default. A
      Managed Dispatch names its Sender with `sender`, or pays from its chain's default.
  - name: Setup
    description: |
      The engine's setup checks, the same ones `pnpm dispatch doctor` runs, as this engine last ran
      them. The console's Setup page reads them.
  - name: Activity
    description: |
      The operator action record: every cancel that landed, every release, every Flag Rule
      create, edit and delete, and every Known Asset added, disabled or enabled, newest first.
  - name: Health
    description: |
      A liveness check for load balancers and scripts.

paths:
  /v1/dispatch:
    post:
      tags: [Dispatches]
      operationId: createDispatch
      summary: Create a Dispatch
      description: |
        Stores a Managed or a Relay Dispatch and answers `202 Accepted` with its id. The answer never
        carries a chain result: the engine has not checked a balance, signed anything or touched the
        chain yet. Poll [Get a Dispatch](#get-a-dispatch) for the outcome.

        Sending the same `Idempotency-Key` again returns the Dispatch that key already created, in its
        current state, with `202`. Nothing new is created and nothing is paid twice. A request that
        fails with `400` stores nothing and does not use up its key.

        A Managed Dispatch that matches an enabled [Flag Rule](./openapi.yaml#list-flag-rules) on its chain is
        stored whole as `held`, and the `202` says so. Nothing is signed, proposed or sent until an
        operator releases it. A Relay Dispatch is never checked, and a repeated `Idempotency-Key`
        answers with the stored Dispatch, held or not, whatever the rules say now.

        `sender` names the configured Sender that pays, as [List Senders](./openapi.yaml#list-senders)
        names it. Left out, the chain's default Sender pays. A name the chain does not have is a `400`
        with `UNKNOWN_SENDER`, and leaving it out on a chain with no default is a `400` with
        `SENDER_REQUIRED`. A Relay Dispatch has no Sender and refuses the field.

        To pay through an aggregator contract on Base, add `bulkCall`. To relay a transaction your user
        signed, send `mode: "relay"` and `signedTransaction` instead of `items`. The
        [guides](./guides/send-payments.md) walk through each.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/ManagedDispatchRequest'
                - $ref: '#/components/schemas/RelayDispatchRequest'
            examples:
              payBase:
                summary: Pay two recipients on Base
                value:
                  chain: base
                  items:
                    - type: payment
                      recipient: '0x8ba1f109551bD432803012645Ac136ddd64DBA72'
                      asset: ETH
                      amount: '50000000000000'
                    - type: payment
                      recipient: '0x8ba1f109551bD432803012645Ac136ddd64DBA72'
                      asset: USDC
                      amount: '40000000'
              callAndPaySolana:
                summary: A memo and a payment on Solana
                value:
                  chain: solana
                  items:
                    - type: call
                      programId: MemoSq4gqABAXKb96qnH8TysNcWxMyWCqXgDLGmfcHr
                      accounts: []
                      data: aW52b2ljZSA0NDcx
                    - type: payment
                      recipient: Dmp2B7tvZKohJCYoD7YRk4aTo5k1Ndz2Wh7pGYsSCaT2
                      asset: SOL
                      amount: '2500000'
              callBase:
                summary: A contract call on Base
                value:
                  chain: base
                  items:
                    - type: call
                      to: '0x8ba1f109551bD432803012645Ac136ddd64DBA72'
                      data: 0x
                      value: '20000000000000'
              bulkCallBase:
                summary: Two payments in one Bulk Call on Base
                value:
                  chain: base
                  bulkCall:
                    aggregator: '0xcA11bde05977b3631167028862bE2a173976CA11'
                    maxBatchSize: 10
                  items:
                    - type: payment
                      recipient: '0x8ba1f109551bD432803012645Ac136ddd64DBA72'
                      asset: ETH
                      amount: '10000000000000'
                    - type: payment
                      recipient: '0xEd77f00C8a16513bc5939e27450ad4D253C876b7'
                      asset: ETH
                      amount: '10000000000000'
              relayBase:
                summary: Relay a signed Base transaction
                value:
                  chain: base
                  mode: relay
                  signedTransaction: '0x02f87183014a3480830f424083d59f80825208948ba1f109551bd432803012645ac136ddd64dba72861b48eb57e00080c001a02c2bc48c3fcabc9f5ea48fb0ee592480f25b957f0ccda68374bb34bb70719e62a0610f05e4780b00923708bd656935e31968d8ca6f21a0c326678105c5b13f54a3'
              relaySolana:
                summary: Relay a signed Solana transaction
                value:
                  chain: solana
                  mode: relay
                  signedTransaction: AfP25/Piq4hD7uKt5vhz4b5QntZw1rvNcJbRWhIoWrirJzCgl7299/SD7DWex9URbl+KhV9n7QiKR5iwM8LsfAoBAAEDHntsSEO3GyebSN8MUQyX06Ws4Taqnwsfzlq2Fqrbze69xvb1VVXvEsuYM2vL94stXfe/jNYCJlYL29F5kB85UQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAKPrcgScoX1f/WGmGI/bmUdz01PT6t/xstWyS4R/+owYBAgIAAQwCAAAAQEtMAAAAAAA=
              resubmitCancelled:
                summary: Resend the key of a cancelled Dispatch
                value:
                  chain: base
                  items:
                    - type: payment
                      recipient: '0x8ba1f109551bD432803012645Ac136ddd64DBA72'
                      asset: USDC
                      amount: '12500000'
              payFromTreasury:
                summary: Pay from a named Sender
                value:
                  chain: base
                  sender: treasury
                  items:
                    - type: payment
                      recipient: '0x8ba1f109551bD432803012645Ac136ddd64DBA72'
                      asset: ETH
                      amount: '250000000000000'
              unknownSender:
                summary: A Sender the chain does not have
                value:
                  chain: base
                  sender: ops
                  items:
                    - type: payment
                      recipient: '0x8ba1f109551bD432803012645Ac136ddd64DBA72'
                      asset: ETH
                      amount: '1'
              relayWithSender:
                summary: A Relay Dispatch that names a Sender
                value:
                  chain: base
                  mode: relay
                  sender: payouts
                  signedTransaction: '0x02f87183014a3480830f424083d59f80825208948ba1f109551bd432803012645ac136ddd64dba72861b48eb57e00080c001a02c2bc48c3fcabc9f5ea48fb0ee592480f25b957f0ccda68374bb34bb70719e62a0610f05e4780b00923708bd656935e31968d8ca6f21a0c326678105c5b13f54a3'
              heldBase:
                summary: A payment over a Flag Rule's limit
                value:
                  chain: base
                  items:
                    - type: payment
                      recipient: '0x8ba1f109551bD432803012645Ac136ddd64DBA72'
                      asset: USDC
                      amount: '7500000000'
              missingIdempotencyKey:
                summary: No Idempotency-Key header
                value:
                  chain: base
                  items:
                    - type: payment
                      recipient: '0x8ba1f109551bD432803012645Ac136ddd64DBA72'
                      asset: ETH
                      amount: '1'
              unknownAsset:
                summary: A token the engine does not know
                value:
                  chain: base
                  items:
                    - type: payment
                      recipient: '0x8ba1f109551bD432803012645Ac136ddd64DBA72'
                      asset: DAI
                      amount: '1000000000000000000'
              decimalAmount:
                summary: An amount with a decimal point
                value:
                  chain: base
                  items:
                    - type: payment
                      recipient: '0x8ba1f109551bD432803012645Ac136ddd64DBA72'
                      asset: USDC
                      amount: '12.5'
              invalidRecipient:
                summary: A malformed Base address
                value:
                  chain: base
                  items:
                    - type: payment
                      recipient: '0x8ba1f109551bD43280301264'
                      asset: ETH
                      amount: '1'
              unknownChain:
                summary: A chain the API does not have
                value:
                  chain: ethereum
                  items: []
              relayNotDecodable:
                summary: Relay bytes that are not a transaction
                value:
                  chain: base
                  mode: relay
                  signedTransaction: '0x02f8'
              batchTooLarge:
                summary: A Bulk Call batch over the limit
                value:
                  chain: base
                  bulkCall:
                    aggregator: '0xcA11bde05977b3631167028862bE2a173976CA11'
                    maxBatchSize: 500
                  items:
                    - type: payment
                      recipient: '0x8ba1f109551bD432803012645Ac136ddd64DBA72'
                      asset: ETH
                      amount: '1'
              bulkCallOnSolana:
                summary: Bulk Call on Solana
                value:
                  chain: solana
                  bulkCall:
                    aggregator: '0xcA11bde05977b3631167028862bE2a173976CA11'
                  items:
                    - type: payment
                      recipient: Dmp2B7tvZKohJCYoD7YRk4aTo5k1Ndz2Wh7pGYsSCaT2
                      asset: SOL
                      amount: '1'
              unauthorized:
                summary: A wrong API token
                value:
                  chain: base
                  items:
                    - type: payment
                      recipient: '0x8ba1f109551bD432803012645Ac136ddd64DBA72'
                      asset: ETH
                      amount: '1'
      responses:
        '202':
          description: Accepted. The Dispatch is stored, or an existing one is returned for its `Idempotency-Key`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DispatchAccepted'
              examples:
                payBase:
                  summary: Pay two recipients on Base
                  value: { dispatchId: 1a2f3f9f-0e2e-461c-b12c-e31391f1d5b4, status: queued }
                callAndPaySolana:
                  summary: A memo and a payment on Solana
                  value: { dispatchId: 5757b997-07b6-4f94-a7f8-80e85ba8d43c, status: queued }
                callBase:
                  summary: A contract call on Base
                  value: { dispatchId: e9dd9112-3da8-40e7-98e3-2bc34fb11a40, status: queued }
                bulkCallBase:
                  summary: Two payments in one Bulk Call on Base
                  value: { dispatchId: 66d96716-22fe-4a3c-bc18-a08b1646fd40, status: queued }
                relayBase:
                  summary: Relay a signed Base transaction
                  value: { dispatchId: 155d989f-0439-4c1c-ac75-68b2204b9d92, status: queued }
                relaySolana:
                  summary: Relay a signed Solana transaction
                  value: { dispatchId: 78dbeb88-ec45-4e73-bf74-f71434302ba4, status: queued }
                resubmitCancelled:
                  summary: Resend the key of a cancelled Dispatch
                  value: { dispatchId: ecf5aff7-d3ce-4c72-92ed-06f910c7b5f2, status: cancelled }
                payFromTreasury:
                  summary: Pay from a named Sender
                  value: { dispatchId: 0b6e4f2a-8c31-4d97-a5e2-9f1c3d7b8a60, status: queued }
                heldBase:
                  summary: Held by a Flag Rule
                  value: { dispatchId: 3f8e2a61-9c4d-4b7e-8f12-6a5d0c9e4b27, status: held }
        '400':
          description: The request is invalid. Nothing was stored, and the `Idempotency-Key` is not used up.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Error'
                  - $ref: '#/components/schemas/PlainError'
                  - $ref: '#/components/schemas/RequestError'
              examples:
                missingIdempotencyKey:
                  summary: No Idempotency-Key header
                  value: { error: Idempotency-Key header is required }
                unknownAsset:
                  summary: A token the engine does not know
                  value:
                    code: UNKNOWN_ASSET
                    message: no known token configured for asset "DAI"
                    chainDetail: { asset: DAI }
                decimalAmount:
                  summary: An amount with a decimal point
                  value: { error: 'items[0]: amount must be a non-negative integer string' }
                invalidRecipient:
                  summary: A malformed Base address
                  value:
                    code: INVALID_RECIPIENT
                    message: 'not a well-formed EVM address: 0x8ba1f109551bD43280301264'
                unknownChain:
                  summary: A chain the API does not have
                  value:
                    statusCode: 400
                    code: FST_ERR_VALIDATION
                    error: Bad Request
                    message: body/chain must be equal to one of the allowed values
                relayNotDecodable:
                  summary: Relay bytes that are not a transaction
                  value:
                    code: CHAIN_REJECTED
                    message: not a decodable signed transaction
                    chainDetail:
                      error: "Position `1` is out of bounds (`0 < position < 1`).\n\nVersion: viem@2.56.9"
                batchTooLarge:
                  summary: A Bulk Call batch over the limit
                  value:
                    code: CHAIN_REJECTED
                    message: maxBatchSize must be 1..50
                    chainDetail: { maxBatchSize: 500 }
                bulkCallOnSolana:
                  summary: Bulk Call on Solana
                  value: { error: chain solana has no Bulk Call mode }
                unknownSender:
                  summary: A Sender the chain does not have
                  value:
                    code: UNKNOWN_SENDER
                    message: 'base has no Sender named "ops" (payouts, treasury)'
                relayWithSender:
                  summary: A Relay Dispatch that names a Sender
                  value:
                    error: 'a relay dispatch has no Sender: it arrives already signed by its own wallet, so it takes no sender'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          description: The body is over 1 MiB. A Dispatch of about 9,000 payment items fits; split a larger run into several Dispatches.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestError'
              examples:
                bodyTooLarge:
                  summary: A body over 1 MiB
                  value:
                    statusCode: 413
                    code: FST_ERR_CTP_BODY_TOO_LARGE
                    error: Payload Too Large
                    message: Request body is too large

  /v1/dispatch/{id}:
    get:
      tags: [Dispatches]
      operationId: getDispatch
      summary: Get a Dispatch
      description: |
        Returns one Dispatch, Managed or Relay, in its current state. `mode` says which shape the
        body has. A Managed Dispatch has a status for the whole Dispatch and one per item. A Relay
        Dispatch is one transaction, so its status, hash and error sit at the top level.

        A Dispatch that was ever held by a Flag Rule carries a `hold` block naming the rule versions
        it matched, and keeps it after it is released or cancelled.

        Add `include=timeline` to see every step the engine took, oldest first.
        [The Dispatch lifecycle](./lifecycle.md) explains each status, and
        [Track a Dispatch](./guides/track.md) reads a timeline line by line.
      parameters:
        - $ref: '#/components/parameters/DispatchId'
        - name: include
          in: query
          required: false
          description: '`timeline` adds a `timeline` array. Any other value leaves the body as it is.'
          schema:
            type: string
          examples:
            managedWithTimeline:
              value: timeline
      responses:
        '200':
          description: The Dispatch.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ManagedDispatch'
                  - $ref: '#/components/schemas/RelayDispatch'
              examples:
                managed:
                  summary: A Managed Dispatch, one item paid and one failed
                  value:
                    dispatchId: 1a2f3f9f-0e2e-461c-b12c-e31391f1d5b4
                    mode: managed
                    chain: base
                    sender: { name: payouts, address: '0x7499BC37AcA4f0F4a7A982Afdfea340AfDd74e6A' }
                    createdAt: '2026-11-01T02:12:17.619Z'
                    status: partial
                    items:
                      - type: payment
                        recipient: '0x8ba1f109551bD432803012645Ac136ddd64DBA72'
                        asset: ETH
                        decimals: 18
                        amount: '50000000000000'
                        status: confirmed
                        transactionHash: '0x7e00aec4eafe72c4c852ff1517ddc1492b4581f117e9a9bbd88602f674735896'
                        error: null
                      - type: payment
                        recipient: '0x8ba1f109551bD432803012645Ac136ddd64DBA72'
                        asset: USDC
                        decimals: 6
                        amount: '40000000'
                        status: failed
                        transactionHash: null
                        error:
                          code: INSUFFICIENT_FUNDS
                          message: insufficient USDC balance
                          chainDetail: { asset: USDC, short: '40000000' }
                managedWithTimeline:
                  summary: The same Dispatch with its timeline
                  value:
                    dispatchId: 1a2f3f9f-0e2e-461c-b12c-e31391f1d5b4
                    mode: managed
                    chain: base
                    sender: { name: payouts, address: '0x7499BC37AcA4f0F4a7A982Afdfea340AfDd74e6A' }
                    createdAt: '2026-11-01T02:12:17.619Z'
                    status: partial
                    items:
                      - type: payment
                        recipient: '0x8ba1f109551bD432803012645Ac136ddd64DBA72'
                        asset: ETH
                        decimals: 18
                        amount: '50000000000000'
                        status: confirmed
                        transactionHash: '0x7e00aec4eafe72c4c852ff1517ddc1492b4581f117e9a9bbd88602f674735896'
                        error: null
                      - type: payment
                        recipient: '0x8ba1f109551bD432803012645Ac136ddd64DBA72'
                        asset: USDC
                        decimals: 6
                        amount: '40000000'
                        status: failed
                        transactionHash: null
                        error:
                          code: INSUFFICIENT_FUNDS
                          message: insufficient USDC balance
                          chainDetail: { asset: USDC, short: '40000000' }
                    timeline:
                      - { kind: created, at: '2026-11-01T02:12:17.619Z' }
                      - kind: failed
                        at: '2026-11-01T02:12:18.695Z'
                        hash: null
                        items: [1]
                        error:
                          code: INSUFFICIENT_FUNDS
                          message: insufficient USDC balance
                          chainDetail: { asset: USDC, short: '40000000' }
                      - { kind: claimed, at: '2026-11-01T02:12:22.042Z' }
                      - kind: written
                        at: '2026-11-01T02:12:22.050Z'
                        hash: '0x7e00aec4eafe72c4c852ff1517ddc1492b4581f117e9a9bbd88602f674735896'
                        items: [0]
                        replaces: null
                      - kind: sent
                        at: '2026-11-01T02:12:22.320Z'
                        hash: '0x7e00aec4eafe72c4c852ff1517ddc1492b4581f117e9a9bbd88602f674735896'
                        items: [0]
                      - kind: confirmed
                        at: '2026-11-01T02:12:27.324Z'
                        hash: '0x7e00aec4eafe72c4c852ff1517ddc1492b4581f117e9a9bbd88602f674735896'
                        items: [0]
                relay:
                  summary: A Relay Dispatch on Solana
                  value:
                    dispatchId: 78dbeb88-ec45-4e73-bf74-f71434302ba4
                    mode: relay
                    chain: solana
                    createdAt: '2026-11-01T02:13:05.098Z'
                    status: confirmed
                    transactionHash: 5suMQ69pdMQgSMWUaHQBcrJ8ydto3tUFhfQPN4VXiWSPFvrjvkM2TVGUjfePRxQ1pxe1LWqgFkEXXQnTU5Z8KJkh
                    error: null
                held:
                  summary: A Dispatch held by a Flag Rule
                  value:
                    dispatchId: 3f8e2a61-9c4d-4b7e-8f12-6a5d0c9e4b27
                    mode: managed
                    chain: base
                    sender: { name: payouts, address: '0x7499BC37AcA4f0F4a7A982Afdfea340AfDd74e6A' }
                    createdAt: '2026-11-01T02:14:02.311Z'
                    status: held
                    items:
                      - type: payment
                        recipient: '0x8ba1f109551bD432803012645Ac136ddd64DBA72'
                        asset: USDC
                        decimals: 6
                        amount: '7500000000'
                        status: held
                        transactionHash: null
                        error: null
                    hold:
                      matched:
                        - rule: { name: Large USDC payment, kind: item_over, asset: USDC, limit: '5000' }
                          ruleId: b3c1e0d2-5f4a-4c8e-9a71-2d6f0e8b9c13
                          ruleVersion: 1
                          items: [0]
                      heldAt: '2026-11-01T02:14:02.311Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/dispatches:
    get:
      tags: [Dispatches]
      operationId: listDispatches
      summary: List Dispatches
      description: |
        Lists Managed and Relay Dispatches together, newest first, a page at a time. Each row is the
        Dispatch without its items, plus how many items it has and the total per asset.

        Pass `nextCursor` back as `cursor` until it is `null`. A `status` filter can return a short or
        empty page that is not the last. [Pagination](./pagination.md) explains why.
      parameters:
        - name: limit
          in: query
          description: Rows per page.
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
          examples:
            firstPage: { value: 2 }
            nextPage: { value: 2 }
        - name: cursor
          in: query
          description: The `nextCursor` of the previous page, passed back as it came.
          schema: { type: string }
          examples:
            nextPage:
              value: WyIyMDI2LTExLTAxVDAyOjEzOjIxLjkyMTI3NloiLCJlY2Y1YWZmNy1kM2NlLTRjNzItOTJlZC0wNmY5MTBjN2I1ZjIiXQ
        - name: chain
          in: query
          description: Only Dispatches on this chain.
          schema: { $ref: '#/components/schemas/Chain' }
          examples:
            partialOnBase: { value: base }
        - name: mode
          in: query
          description: Only Managed or only Relay Dispatches.
          schema: { type: string, enum: [managed, relay] }
        - name: status
          in: query
          description: |
            Only Dispatches whose top-level status is this one, as Get a Dispatch reports it.
            `abandoned` matches only a Relay Dispatch, and `held` only a Managed one.
          schema:
            type: string
            enum: [queued, held, broadcasting, confirmed, failed, partial, abandoned, cancelled]
          examples:
            partialOnBase: { value: partial }
            unknownStatus: { value: done }
        - name: sender
          in: query
          description: |
            Only Managed Dispatches paid by the Sender of this name, so never a Relay Dispatch. Names
            are unique per chain, so without `chain` it matches every chain's Sender of that name.
          schema: { type: string, minLength: 1 }
          examples:
            byTreasury: { value: treasury }
            unknownSenderFilter: { value: ops }
        - name: from
          in: query
          description: Only Dispatches created at or after this ISO 8601 time.
          schema: { type: string, format: date-time }
          examples:
            badFrom: { value: yesterday }
        - name: to
          in: query
