  /v1/dispatch/{id}/cancel:
    post:
      tags: [Dispatches]
      operationId: cancelDispatch
      summary: Cancel a Dispatch
      description: |
        Withdraws a Managed or Relay Dispatch that the engine has not claimed yet, `held` ones
        included. Nothing was or will be signed, proposed or sent, and every item reads `cancelled`.
        Either token can cancel. The body is optional: a `reason` is kept in the
        [activity record](./openapi.yaml#list-operator-actions) with the cancel.

        The cancel and the worker's claim are decided in one atomic write, so exactly one of them wins.
        A running worker claims a queued Dispatch within a few seconds, so in practice you cancel what
        is still waiting: when the worker is stopped, busy, or does not serve the chain. Cancelling a
        cancelled Dispatch answers `200` with its current state. [Cancel a Dispatch](./guides/cancel.md)
        has the rules.
      parameters:
        - $ref: '#/components/parameters/DispatchId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonBody'
            examples:
              cancelled:
                summary: Cancel with a reason
                value: { reason: duplicate of refund 7730 }
              blankReason:
                summary: An empty reason
                value: { reason: '' }
      responses:
        '200':
          description: Cancelled. The body is the Dispatch, as Get a Dispatch returns it.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ManagedDispatch'
                  - $ref: '#/components/schemas/RelayDispatch'
              examples:
                cancelled:
                  summary: A cancelled Dispatch
                  value:
                    dispatchId: ecf5aff7-d3ce-4c72-92ed-06f910c7b5f2
                    mode: managed
                    chain: base
                    sender: { name: payouts, address: '0x7499BC37AcA4f0F4a7A982Afdfea340AfDd74e6A' }
                    createdAt: '2026-11-01T02:13:21.921Z'
                    status: cancelled
                    items:
                      - type: payment
                        recipient: '0x8ba1f109551bD432803012645Ac136ddd64DBA72'
                        asset: USDC
                        decimals: 6
                        amount: '12500000'
                        status: cancelled
                        transactionHash: null
                        error: null
        '400':
          $ref: '#/components/responses/BadReason'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Too late. The worker already claimed the Dispatch, whatever its items have done since.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                alreadyClaimed:
                  summary: The worker already claimed it
                  value:
                    code: ALREADY_CLAIMED
                    message: the engine has already claimed this Dispatch, so it can no longer be cancelled

  /v1/dispatch/{id}/release:
    post:
      tags: [Dispatches]
      operationId: releaseDispatch
      summary: Release a held Dispatch
      description: |
        Lets a `held` Dispatch go ahead. It becomes `queued` and runs as if it had never been held,
        and its `hold` block gains `releasedAt` and `reason`. Only the operator token can release,
        so a client cannot release its own Dispatch. A `reason` is required, and the release is
        written to the [activity record](./openapi.yaml#list-operator-actions).

        A release and a cancel of the same held Dispatch are each one write conditional on its
        status, so exactly one of them takes it out of `held`. Of two releases, one answers `200`
        and the other `409`.
      security:
        - operatorToken: []
      parameters:
        - $ref: '#/components/parameters/DispatchId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ReasonBody'
              required: [reason]
            examples:
              released:
                summary: Release with a reason
                value: { reason: checked with finance }
              missingReason:
                summary: No reason
                value: {}
              notHeld:
                summary: A Dispatch that is not held
                value: { reason: checked with finance }
              notFound:
                summary: No such Dispatch
                value: { reason: checked with finance }
      responses:
        '200':
          description: Released. The body is the Dispatch, as Get a Dispatch returns it, now `queued`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedDispatch'
              examples:
                released:
                  summary: A released Dispatch
                  value:
                    dispatchId: 3f8e2a61-9c4d-4b7e-8f12-6a5d0c9e4b27
                    mode: managed
                    chain: base
                    sender: { name: payouts, address: '0x7499BC37AcA4f0F4a7A982Afdfea340AfDd74e6A' }
                    createdAt: '2026-11-01T02:14:02.311Z'
                    status: queued
                    items:
                      - type: payment
                        recipient: '0x8ba1f109551bD432803012645Ac136ddd64DBA72'
                        asset: USDC
                        decimals: 6
                        amount: '7500000000'
                        status: queued
                        transactionHash: null
                        error: null
                    hold:
                      matched:
                        - rule: { name: Large USDC payment, kind: item_over, asset: USDC, limit: '5000' }
                          ruleId: b3c1e0d2-5f4a-4c8e-9a71-2d6f0e8b9c13
                          ruleVersion: 1
                          items: [0]
                      heldAt: '2026-11-01T02:14:02.311Z'
                      releasedAt: '2026-11-01T02:31:47.052Z'
                      reason: checked with finance
        '400':
          description: The body has no `reason`, or an empty one.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlainError'
              examples:
                missingReason:
                  summary: No reason
                  value: { error: 'reason: required, a non-empty string' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/OperatorOnly'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The Dispatch is not `held`. It was already released or cancelled, was never held, or is a Relay Dispatch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notHeld:
                  summary: Not held
                  value:
                    code: NOT_HELD
                    message: this Dispatch is not held, so there is nothing to release

  /v1/flag-rules:
    get:
      tags: [Flag Rules]
      operationId: listFlagRules
      summary: List Flag Rules
      description: |
        Returns every rule that is not deleted, oldest first, each in its current version with its
        whole history. Either token can read.

        Every Managed Dispatch is checked against the current version of each enabled rule on its
        chain that applies to its Sender when it is submitted, after every other check passes. The check reads only the
        engine's own database, never a chain. If any rule matches, the whole Dispatch is stored
        `held`. Editing or deleting a rule never re-checks or releases a Dispatch already held.
      security:
        - apiToken: []
        - operatorToken: []
      responses:
        '200':
          description: The rules.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [rules]
                properties:
                  rules:
                    type: array
                    items: { $ref: '#/components/schemas/FlagRule' }
              examples:
                rules:
                  summary: One rule
                  value:
                    rules:
                      - ruleId: b3c1e0d2-5f4a-4c8e-9a71-2d6f0e8b9c13
                        version: 1
                        name: Large USDC payment
                        chain: base
                        sender: null
                        enabled: true
                        kind: item_over
                        asset: USDC
                        limit: '5000'
                        createdAt: '2026-11-01T02:13:50.118Z'
                        updatedAt: '2026-11-01T02:13:50.118Z'
                        deletedAt: null
                        versions:
                          - version: 1
                            name: Large USDC payment
                            chain: base
                            sender: null
                            enabled: true
                            kind: item_over
                            asset: USDC
                            limit: '5000'
                            createdAt: '2026-11-01T02:13:50.118Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Flag Rules]
      operationId: createFlagRule
      summary: Create a Flag Rule
      description: |
        Creates version 1 of a rule. Only the operator token can write rules, and every create is
        written to the [activity record](./openapi.yaml#list-operator-actions), with the `reason` if you give one.

        `limit` is a decimal string in whole units of the asset (`"5000"`, `"0.5"`), unlike a payment
        item's `amount`, which is in the smallest unit. It must be more than zero, with no more
        decimal places than the asset has. `asset` must be one the engine knows on that chain, and
        each of `addresses` must be valid on it. Base addresses are stored checksummed and compared
        without regard to case. Any field that is not the rule kind's own is a `400`.

        `sender` scopes the rule to one named Sender on its chain, so it checks only the Dispatches
        that Sender pays. Without it, the rule checks every Sender on the chain. The rule stores the
        Sender's address, so renaming the Sender keeps the scope. A scoped `daily_volume_over` counts
        only that Sender's Dispatches.
      security:
        - operatorToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlagRuleRequest'
            examples:
              itemOverUsdc:
                summary: Hold any USDC payment over 5,000
                value: { name: Large USDC payment, chain: base, kind: item_over, asset: USDC, limit: '5000', reason: finance asked for a second look over 5k }
              treasuryEth:
                summary: Hold the treasury Sender's ETH payments over 0.75
                value: { name: Large treasury ETH, chain: base, sender: treasury, kind: item_over, asset: ETH, limit: '0.75' }
              unknownSender:
                summary: A Sender the chain does not have
                value: { name: Large USDC payment, chain: base, sender: ops, kind: item_over, asset: USDC, limit: '5000' }
              tooPrecise:
                summary: A limit with more decimals than the asset
                value: { name: Large USDC payment, chain: base, kind: item_over, asset: USDC, limit: '1.0000001' }
              wrongParameter:
                summary: A parameter of another kind
                value: { name: New payee, chain: solana, kind: first_time_recipient, limit: '10' }
              unauthorized:
                summary: A wrong token
                value: { name: Large USDC payment, chain: base, kind: item_over, asset: USDC, limit: '5000' }
              notOperator:
                summary: The API token instead of the operator token
                value: { name: Large USDC payment, chain: base, kind: item_over, asset: USDC, limit: '5000' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlagRule'
              examples:
                itemOverUsdc:
                  summary: The new rule
                  value:
                    ruleId: b3c1e0d2-5f4a-4c8e-9a71-2d6f0e8b9c13
                    version: 1
                    name: Large USDC payment
                    chain: base
                    sender: null
                    enabled: true
                    kind: item_over
                    asset: USDC
                    limit: '5000'
                    createdAt: '2026-11-01T02:13:50.118Z'
                    updatedAt: '2026-11-01T02:13:50.118Z'
                    deletedAt: null
                    versions:
                      - version: 1
                        name: Large USDC payment
                        chain: base
                        sender: null
                        enabled: true
                        kind: item_over
                        asset: USDC
                        limit: '5000'
                        createdAt: '2026-11-01T02:13:50.118Z'
                treasuryEth:
                  summary: A rule scoped to one Sender
                  value:
                    ruleId: 0c5e7b41-93d2-4f8a-b6e0-71a2d4c9f358
                    version: 1
                    name: Large treasury ETH
                    chain: base
                    sender: { name: treasury, address: '0x5afe000000000000000000000000000000005afe' }
                    enabled: true
                    kind: item_over
                    asset: ETH
                    limit: '0.75'
                    createdAt: '2026-11-01T02:14:07.562Z'
                    updatedAt: '2026-11-01T02:14:07.562Z'
                    deletedAt: null
                    versions:
                      - version: 1
                        name: Large treasury ETH
                        chain: base
                        sender: { name: treasury, address: '0x5afe000000000000000000000000000000005afe' }
                        enabled: true
                        kind: item_over
                        asset: ETH
                        limit: '0.75'
                        createdAt: '2026-11-01T02:14:07.562Z'
        '400':
          description: The rule is invalid. `error` names the field at fault.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlainError'
              examples:
                unknownSender:
                  summary: A Sender the chain does not have
                  value: { error: 'sender: base has no Sender named "ops" (payouts, treasury)' }
                tooPrecise:
                  summary: A limit with more decimals than the asset
                  value: { error: 'limit: USDC has 6 decimal places, so "1.0000001" is too precise' }
                wrongParameter:
                  summary: A parameter of another kind
                  value: { error: 'limit: not a parameter of first_time_recipient' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/OperatorOnly'

  /v1/flag-rules/preview:
    post:
      tags: [Flag Rules]
      operationId: previewFlagRule
      summary: Preview a Flag Rule
      description: |
        Says how many of the last 30 days' Managed Dispatches on the rule's chain a rule would have
        held, before you switch it on. A rule with a `sender` looks only at that Sender's
        Dispatches. Nothing is saved and nothing is written to the activity
        record. The body is a rule as for Create a Flag Rule; `name`, `enabled` and `reason` are
        optional and ignored.

        Each Dispatch is run through the same matcher as the check at submission, with the facts as
        they were when it was submitted. Every Managed Dispatch in the window counts, whatever its
        status now. One preview reads at most 2,000 Dispatches, the 24 hours before the window
        included, newest first. When there were more, `capped` is `true`, the oldest are left out,
        and `wouldHold` is a lower bound.
      security:
        - operatorToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlagRuleCheck'
            examples:
              dailyVolumeSol:
                summary: More than 100 SOL a day
                value: { chain: solana, kind: daily_volume_over, asset: SOL, limit: '100' }
              dispatchTotalEth:
                summary: A Dispatch paying more than 1.5 ETH in all
                value: { chain: base, kind: dispatch_total_over, asset: ETH, limit: '1.5' }
              treasuryAnyEth:
                summary: Any ETH payment from the treasury Sender over 0.0001
                value: { chain: base, sender: treasury, kind: item_over, asset: ETH, limit: '0.0001' }
              firstTimeRecipient:
                summary: A recipient never paid before
                value: { chain: solana, kind: first_time_recipient }
              knownPayees:
                summary: Only pay known addresses
                value: { chain: base, kind: recipient_not_allowlisted, addresses: ['0x8ba1f109551bD432803012645Ac136ddd64DBA72'] }
              knownPrograms:
                summary: Only call known programs
                value: { chain: solana, kind: call_target_not_allowlisted, addresses: [MemoSq4gqABAXKb96qnH8TysNcWxMyWCqXgDLGmfcHr] }
              unknownAsset:
                summary: An asset the engine does not know on the chain
                value: { chain: solana, kind: item_over, asset: DAI, limit: '10' }
      responses:
        '200':
          description: What the rule would have held.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlagRulePreview'
              examples:
                dailyVolumeSol:
                  summary: Nothing over the limit
                  value: { from: '2026-10-02T02:20:11.402Z', to: '2026-11-01T02:20:11.402Z', scanned: 2, capped: false, wouldHold: 0, examples: [] }
                dispatchTotalEth:
                  summary: Nothing over the limit
                  value: { from: '2026-10-02T02:20:11.402Z', to: '2026-11-01T02:20:11.402Z', scanned: 4, capped: false, wouldHold: 0, examples: [] }
                treasuryAnyEth:
                  summary: The treasury's one Dispatch paid more
                  value:
                    from: '2026-10-02T02:20:11.402Z'
                    to: '2026-11-01T02:20:11.402Z'
                    scanned: 1
                    capped: false
                    wouldHold: 1
                    examples:
                      - { dispatchId: 3e9f1a72-c45b-4d08-8e6a-0b7d2f5c1a94, createdAt: '2026-11-01T02:12:48.931Z', items: [0] }
                firstTimeRecipient:
                  summary: Every Dispatch paid someone new
                  value:
                    from: '2026-10-02T02:20:11.402Z'
                    to: '2026-11-01T02:20:11.402Z'
                    scanned: 2
                    capped: false
                    wouldHold: 2
                    examples:
                      - { dispatchId: ec4a9228-b427-4f4e-9792-44ab1b8fcbd6, createdAt: '2026-11-01T02:13:35.704Z', items: [0, 1] }
                      - { dispatchId: 5757b997-07b6-4f94-a7f8-80e85ba8d43c, createdAt: '2026-11-01T02:12:41.207Z', items: [1] }
                knownPayees:
                  summary: One Dispatch paid an address not on the list
                  value:
                    from: '2026-10-02T02:20:11.402Z'
                    to: '2026-11-01T02:20:11.402Z'
                    scanned: 4
                    capped: false
                    wouldHold: 1
                    examples:
                      - { dispatchId: 66d96716-22fe-4a3c-bc18-a08b1646fd40, createdAt: '2026-11-01T02:12:55.480Z', items: [1] }
                knownPrograms:
                  summary: Every call went to a listed program
                  value: { from: '2026-10-02T02:20:11.402Z', to: '2026-11-01T02:20:11.402Z', scanned: 2, capped: false, wouldHold: 0, examples: [] }
        '400':
          description: The rule is invalid. `error` names the field at fault.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlainError'
              examples:
                unknownAsset:
                  summary: An asset the engine does not know on the chain
                  value: { error: 'asset: DAI is not a known asset on solana' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/OperatorOnly'

  /v1/flag-rules/{id}:
    get:
      tags: [Flag Rules]
      operationId: getFlagRule
      summary: Get a Flag Rule
      description: |
        Returns one rule, deleted or not, with every version. Either token can read. A Dispatch's
        `hold` block names the `ruleId` and `ruleVersion` it matched, and this shows what that
        version said.
      security:
        - apiToken: []
        - operatorToken: []
      parameters:
        - $ref: '#/components/parameters/RuleId'
      responses:
        '200':
          description: The rule.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlagRule'
              examples:
                rule:
                  summary: A rule in its first version
                  value:
                    ruleId: b3c1e0d2-5f4a-4c8e-9a71-2d6f0e8b9c13
                    version: 1
                    name: Large USDC payment
                    chain: base
                    sender: null
                    enabled: true
                    kind: item_over
                    asset: USDC
                    limit: '5000'
                    createdAt: '2026-11-01T02:13:50.118Z'
                    updatedAt: '2026-11-01T02:13:50.118Z'
                    deletedAt: null
                    versions:
                      - version: 1
                        name: Large USDC payment
                        chain: base
                        sender: null
                        enabled: true
                        kind: item_over
                        asset: USDC
                        limit: '5000'
                        createdAt: '2026-11-01T02:13:50.118Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/RuleNotFound'
    put:
      tags: [Flag Rules]
      operationId: updateFlagRule
      summary: Edit a Flag Rule
      description: |
        Writes the next version of a rule. Send its whole new content, in the same body as Create a
        Flag Rule. Rules are forward-only: an edit never changes an earlier version, so a held
        Dispatch always names the version it matched. The edit is written to the activity record.
      security:
        - operatorToken: []
      parameters:
