        '401':
          $ref: '#/components/responses/Unauthorized'

  /health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Check the API is up
      description: |
        Answers `200` while the API process is running. It needs no token and reads nothing else: it
        does not check the database, the worker, the Signer or any RPC.
      security: []
      responses:
        '200':
          description: The API process is running.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status: { const: ok }
              examples:
                up:
                  summary: Running
                  value: { status: ok }

components:
  securitySchemes:
    apiToken:
      type: http
      scheme: bearer
      description: |
        The engine's API token, `AUTH_TOKEN` in its environment. There is one token per engine, with
        no users or scopes, so treat it like a database password. The web console signs in with the
        same token.

    operatorToken:
      type: http
      scheme: bearer
      description: |
        The engine's operator token, `OPERATOR_TOKEN` in its environment. It does everything the API
        token does, and is the only token the operator-only routes accept: releasing a held
        Dispatch, writing and previewing Flag Rules and Known Assets, and reading the activity record. The API token
        gets `403` on those routes, and so does everyone when the operator has not set an operator
        token.

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        A string you choose that makes the request safe to repeat. The same key returns the Dispatch
        it already created. Keys are global to the engine, so derive one from your own records, such
        as an invoice number or a payroll run id.
      schema: { type: string, minLength: 1 }
      examples:
        payBase: { value: payroll-2026-11-01 }
        callAndPaySolana: { value: invoice-4471 }
        callBase: { value: call-base-2026-11-01 }
        bulkCallBase: { value: bulk-base-2026-11-01 }
        relayBase: { value: relay-order-8841 }
        relaySolana: { value: relay-order-8842 }
        resubmitCancelled: { value: refund-7731 }
        heldBase: { value: payout-9912 }
        payFromTreasury: { value: treasury-2026-11-01 }
        unknownSender: { value: probe-unknown-sender }
        relayWithSender: { value: probe-relay-sender }
        unknownAsset: { value: probe-unknown-asset }
        decimalAmount: { value: probe-decimal }
        invalidRecipient: { value: probe-bad-addr }
        unknownChain: { value: probe-chain }
        relayNotDecodable: { value: probe-relay-bad }
        batchTooLarge: { value: probe-batch }
        bulkCallOnSolana: { value: probe-sol-bulk }
        unauthorized: { value: payroll-2026-11-01 }
    DispatchId:
      name: id
      in: path
      required: true
      description: The `dispatchId` that Create a Dispatch returned.
      schema: { type: string, format: uuid }
      examples:
        managed: { value: 1a2f3f9f-0e2e-461c-b12c-e31391f1d5b4 }
        managedWithTimeline: { value: 1a2f3f9f-0e2e-461c-b12c-e31391f1d5b4 }
        relay: { value: 78dbeb88-ec45-4e73-bf74-f71434302ba4 }
        cancelled: { value: ecf5aff7-d3ce-4c72-92ed-06f910c7b5f2 }
        alreadyClaimed: { value: 1a2f3f9f-0e2e-461c-b12c-e31391f1d5b4 }
        notFound: { value: 00000000-0000-4000-8000-000000000000 }
        unauthorized: { value: 1a2f3f9f-0e2e-461c-b12c-e31391f1d5b4 }
        held: { value: 3f8e2a61-9c4d-4b7e-8f12-6a5d0c9e4b27 }
        released: { value: 3f8e2a61-9c4d-4b7e-8f12-6a5d0c9e4b27 }
        missingReason: { value: 3f8e2a61-9c4d-4b7e-8f12-6a5d0c9e4b27 }
        notOperator: { value: 3f8e2a61-9c4d-4b7e-8f12-6a5d0c9e4b27 }
        notHeld: { value: 1a2f3f9f-0e2e-461c-b12c-e31391f1d5b4 }
        blankReason: { value: ecf5aff7-d3ce-4c72-92ed-06f910c7b5f2 }
    RuleId:
      name: id
      in: path
      required: true
      description: The `ruleId` that Create a Flag Rule returned.
      schema: { type: string, format: uuid }
      examples:
        rule: { value: b3c1e0d2-5f4a-4c8e-9a71-2d6f0e8b9c13 }
        raiseLimit: { value: b3c1e0d2-5f4a-4c8e-9a71-2d6f0e8b9c13 }
        deleted: { value: b3c1e0d2-5f4a-4c8e-9a71-2d6f0e8b9c13 }
        ruleDeleted: { value: b3c1e0d2-5f4a-4c8e-9a71-2d6f0e8b9c13 }
        tooPrecise: { value: b3c1e0d2-5f4a-4c8e-9a71-2d6f0e8b9c13 }
        notFound: { value: 00000000-0000-4000-8000-000000000000 }
        unauthorized: { value: b3c1e0d2-5f4a-4c8e-9a71-2d6f0e8b9c13 }
        notOperator: { value: b3c1e0d2-5f4a-4c8e-9a71-2d6f0e8b9c13 }

    AssetId:
      name: id
      in: path
      required: true
      description: The `id` of a Known Asset, from List Known Assets or Add a Known Asset.
      schema: { type: string, format: uuid }
      examples:
        disableAsset: { value: f1c40b26-3c95-44a8-a06b-5bc06b5272dd }
        configAsset: { value: 90f91669-f845-45bf-b44a-d571ac098032 }
        notFound: { value: 00000000-0000-4000-8000-000000000000 }
        unauthorized: { value: f1c40b26-3c95-44a8-a06b-5bc06b5272dd }
        notOperator: { value: f1c40b26-3c95-44a8-a06b-5bc06b5272dd }

  responses:
    Unauthorized:
      description: The `Authorization` header is missing, or its token is not the engine's `AUTH_TOKEN`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PlainError'
          examples:
            unauthorized:
              summary: A wrong API token
              value: { error: unauthorized }
    NotFound:
      description: No Dispatch has this id. An id that is not a UUID gets the same answer.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PlainError'
          examples:
            notFound:
              summary: No such Dispatch
              value: { error: not found }

    OperatorOnly:
      description: |
        The route needs the operator token. The API token gets this, and so does every token when
        the operator has not set `OPERATOR_TOKEN`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PlainError'
          examples:
            notOperator:
              summary: The API token instead of the operator token
              value: { error: 'this route needs OPERATOR_TOKEN, not AUTH_TOKEN' }
    RuleNotFound:
      description: No Flag Rule has this id. An id that is not a UUID gets the same answer.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PlainError'
          examples:
            notFound:
              summary: No such rule
              value: { error: not found }
    BadReason:
      description: '`reason` is not a non-empty string.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PlainError'
          examples:
            blankReason:
              summary: An empty reason
              value: { error: 'reason: must be a non-empty string' }

  schemas:
    Chain:
      type: string
      enum: [base, solana]
      description: The chain. It must be in the engine's `ENABLED_CHAINS`. Which network it means, test or main, is the engine's configuration.

    Amount:
      type: string
      pattern: '^\d+$'
      description: A whole number in the asset's smallest unit, as a string. `40000000` is 40 USDC (6 decimals), and `50000000000000` wei is 0.00005 ETH.

    PaymentRequest:
      title: A payment item
      type: object
      required: [type, recipient, asset, amount]
      properties:
        type: { const: payment }
        recipient:
          type: string
          description: The address that receives the payment. It needs no account with the engine.
        asset:
          type: string
          description: '`ETH` on Base, `SOL` on Solana, or a token symbol the operator listed in `BASE_KNOWN_TOKENS` or `SOLANA_KNOWN_TOKENS`.'
        amount: { $ref: '#/components/schemas/Amount' }

    BaseCallRequest:
      title: A call item on Base
      type: object
      required: [type, to, data, value]
      properties:
        type: { const: call }
        to: { type: string, description: The contract or address to call. }
        data: { type: string, description: 'The calldata, as `0x` hex. `0x` sends no data.' }
        value: { $ref: '#/components/schemas/Amount', description: The wei to send with the call, as a string. }

    SolanaCallRequest:
      title: A call item on Solana
      type: object
      required: [type, programId, accounts, data]
      properties:
        type: { const: call }
        programId: { type: string, description: The program to invoke. }
        accounts:
          type: array
          description: The instruction's accounts, in order. The engine can sign only for the Sender.
          items:
            type: object
            required: [pubkey, isSigner, isWritable]
            properties:
              pubkey: { type: string }
              isSigner: { type: boolean }
              isWritable: { type: boolean }
        data: { type: string, description: The instruction data, base64. }

    BulkCall:
      type: object
      additionalProperties: false
      required: [aggregator]
      description: Base only. Sends the items as `aggregate3Value` calls through an aggregator contract you name.
      properties:
        aggregator:
          type: string
          minLength: 1
          description: The aggregator's address. It must have contract code on the engine's network. ERC-20 items are refused through the canonical Multicall3.
        maxBatchSize:
          type: integer
          minimum: 1
          description: The most items per transaction. Defaults to, and cannot exceed, the operator's `BASE_BULK_CALL_MAX_BATCH_SIZE` (50 by default).
        allowFailure:
          type: boolean
          default: false
          description: '`false`: the items in one transaction land or fail together. `true`: each item lands or fails on its own, and the operator must set `BASE_TRACE_RPC_URL`.'

    ManagedDispatchRequest:
      title: A Managed Dispatch
      type: object
      additionalProperties: false
      required: [chain, items]
      properties:
        chain: { $ref: '#/components/schemas/Chain' }
        sender:
          type: string
          minLength: 1
          description: The name of the configured Sender that pays. Left out, the chain's default Sender pays.
        mode:
          type: string
          enum: [managed]
          default: managed
          description: Leave it out, or send `managed`.
        items:
          type: array
          minItems: 1
          description: What to send, in order. Mix payments and calls freely. Each item gets its own status.
          items:
            oneOf:
              - $ref: '#/components/schemas/PaymentRequest'
              - $ref: '#/components/schemas/BaseCallRequest'
              - $ref: '#/components/schemas/SolanaCallRequest'
        retryPolicy:
          type: boolean
          description: Whether the engine may raise the fee of a stuck Base transaction. Left out, the operator's `DEFAULT_RETRY_POLICY` applies, which is off unless the operator turns it on. Fixed for the Dispatch's whole life.
        bulkCall: { $ref: '#/components/schemas/BulkCall' }

    RelayDispatchRequest:
      title: A Relay Dispatch
      type: object
      additionalProperties: false
      required: [chain, mode, signedTransaction]
      properties:
        chain: { $ref: '#/components/schemas/Chain' }
        mode: { const: relay }
        signedTransaction:
          type: string
          minLength: 1
          description: |
            The signed transaction, base64. On Base the usual `0x` hex raw transaction works too: an
            EIP-1559 (type `0x02`) transaction for the engine's chain ID, with a low-s signature. On
            Solana a legacy or v0 transaction whose every required signature verifies.

    DispatchAccepted:
      type: object
      additionalProperties: false
      required: [dispatchId, status]
      properties:
        dispatchId: { type: string, format: uuid }
        status:
          type: string
          enum: [queued, held, broadcasting, cancelled]
          description: '`queued` for a new Dispatch, or `held` when it matched a Flag Rule. A repeated `Idempotency-Key` returns the stored status of the Dispatch it created.'

    DispatchStatus:
      type: string
      enum: [queued, held, broadcasting, confirmed, failed, partial, cancelled]
      description: The whole Dispatch. `held` waits for an operator to release it. `confirmed`, `failed` and `partial` are worked out from the items each time you read.

    ItemStatus:
      type: string
      enum: [queued, held, awaiting_approval, broadcasting, confirmed, failed, abandoned, cancelled]
      description: One item, or a Relay Dispatch's one transaction. A Relay Dispatch is never `held`.

    Error:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - INSUFFICIENT_FUNDS
            - INVALID_RECIPIENT
            - UNKNOWN_ASSET
            - CHAIN_REJECTED
            - RPC_UNAVAILABLE
            - SIGNER_UNREACHABLE
            - SIGNER_REFUSED
            - CHAIN_NOT_ENABLED
            - UNKNOWN_SENDER
            - SENDER_REQUIRED
            - NONCE_ALREADY_USED
            - APPROVAL_REJECTED
            - APPROVAL_TIMEOUT
            - ALREADY_CLAIMED
            - NOT_HELD
            - RULE_DELETED
            - NOT_A_TOKEN
            - NOT_PAYABLE
            - SYMBOL_REQUIRED
            - SYMBOL_TAKEN
            - ASSET_EXISTS
            - CONFIG_ASSET
          description: What went wrong. Switch on this. [Errors](./errors.md) lists what to do about each.
        message: { type: string, description: The most specific reason available, for people. On Base it is often the node's own words. }
        chainDetail: { description: The raw detail from the chain or the check, such as a shortfall, a JSON-RPC code or revert data. Its shape depends on the code. }

    PlainError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error: { type: string }

    RequestError:
      type: object
      additionalProperties: false
      required: [statusCode, code, error, message]
      description: The HTTP server refused the request before the route read it.
      properties:
        statusCode: { type: integer, description: The HTTP status again. }
        code:
          type: string
          enum: [FST_ERR_VALIDATION, FST_ERR_CTP_INVALID_JSON_BODY, FST_ERR_CTP_BODY_TOO_LARGE]
          description: '`FST_ERR_VALIDATION`: the body or query string broke the route''s schema. `FST_ERR_CTP_INVALID_JSON_BODY`: the body is not valid JSON. `FST_ERR_CTP_BODY_TOO_LARGE`: the body is over 1 MiB.'
        error: { type: string, description: The HTTP status text. }
        message: { type: string, description: 'What broke, such as `body/chain must be equal to one of the allowed values`.' }

    AssetTotal:
      type: object
      additionalProperties: false
      required: [asset, amount]
      properties:
        asset: { type: string }
        amount: { $ref: '#/components/schemas/Amount' }
        decimals: { type: integer, description: How many decimal places the asset has. Left out when the asset is no longer configured. }

    ChainRef:
      description: The multisig's own handle for the Proposal, to open it in the Squads or Safe app.
      oneOf:
        - type: object
          additionalProperties: false
          required: [kind, multisig, proposal, transactionIndex]
          properties:
            kind: { const: squads }
            multisig: { type: string }
            proposal: { type: string }
            transactionIndex: { type: integer }
        - type: object
          additionalProperties: false
          required: [kind, safe, safeTxHash, nonce]
          properties:
            kind: { const: safe }
            safe: { type: string }
            safeTxHash: { type: string }
            nonce: { type: integer }

    Approval:
      type: object
      additionalProperties: false
      description: Only on an item of a Multisig Sender whose Call is in a Proposal.
      required: [state, approvals, threshold, deadline, expected, chainRef]
      properties:
        state:
          type: string
          enum: [awaiting, approved, approved_after_deadline]
          description: '`awaiting` is below the threshold. `approved` has reached it. `approved_after_deadline` was approved too late, and the engine will not execute it.'
        approvals: { type: integer, description: The votes so far. }
        threshold: { type: integer, description: The votes needed. }
        deadline: { type: string, format: date-time, description: When the engine stops waiting. After it the item is `abandoned` with `APPROVAL_TIMEOUT`. }
        expected:
          type: object
          additionalProperties: false
          required: [recipients, totals]
          description: What the engine says this Proposal pays. A mistake-catcher for Approvers, not a control.
          properties:
            recipients: { type: integer }
            totals:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [asset, amount]
                properties:
                  asset: { type: string }
                  amount: { $ref: '#/components/schemas/Amount' }
        chainRef: { $ref: '#/components/schemas/ChainRef' }

    ItemOutcome:
      type: object
      required: [status, transactionHash, error]
      properties:
        status: { $ref: '#/components/schemas/ItemStatus' }
        transactionHash:
          type: [string, 'null']
          description: The transaction that carries the item. `null` until one is signed. Several items can share one.
        error:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/Error'
          description: '`null` unless the item failed or was abandoned.'
        approval: { $ref: '#/components/schemas/Approval' }

    PaymentItem:
      title: A payment item
      allOf:
        - $ref: '#/components/schemas/ItemOutcome'
      type: object
      unevaluatedProperties: false
      required: [type, recipient, asset, amount]
      properties:
        type: { const: payment }
        recipient: { type: string }
        asset: { type: string }
        decimals: { type: integer, description: The asset's decimal places, from the engine's configuration. Left out when the asset is no longer configured. }
        amount: { $ref: '#/components/schemas/Amount' }

    CallItem:
      title: A call item
      allOf:
        - $ref: '#/components/schemas/ItemOutcome'
      type: object
      unevaluatedProperties: false
      required: [type]
      description: A call item shows only its target, `to` on Base or `programId` on Solana. Its data, value and accounts are left out.
      properties:
        type: { const: call }
        to: { type: string }
        programId: { type: string }
      oneOf:
        - required: [to]
        - required: [programId]

    TimelineEntry:
      description: One step, oldest first. `items` are the positions of the items the step is about. `hash` names one version of a transaction.
      oneOf:
        - title: created
          type: object
          additionalProperties: false
          required: [kind, at]
          properties: { kind: { const: created }, at: { type: string, format: date-time } }
        - title: claimed
          type: object
          additionalProperties: false
          required: [kind, at]
          properties: { kind: { const: claimed }, at: { type: string, format: date-time } }
        - title: cancelled
          type: object
          additionalProperties: false
          required: [kind, at]
          properties: { kind: { const: cancelled }, at: { type: string, format: date-time } }
        - title: written
          type: object
          additionalProperties: false
          required: [kind, at, hash, items, replaces]
          properties:
            kind: { const: written }
            at: { type: string, format: date-time }
            hash: { type: string }
            items: { type: array, items: { type: integer } }
            replaces: { type: [string, 'null'] }
        - title: sent
          type: object
          additionalProperties: false
          required: [kind, at, hash, items]
          properties:
            kind: { const: sent }
            at: { type: string, format: date-time }
            hash: { type: string }
            items: { type: array, items: { type: integer } }
        - title: attempt
          type: object
          additionalProperties: false
          required: [kind, at, hash, items, error]
          properties:
            kind: { const: attempt }
            at: { type: string, format: date-time }
            hash: { type: string }
            items: { type: array, items: { type: integer } }
            error: { oneOf: [{ type: 'null' }, { $ref: '#/components/schemas/Error' }] }
        - title: replaced or dropped
          type: object
          additionalProperties: false
          required: [kind, at, hash, items, by]
          properties:
            kind: { enum: [replaced, dropped] }
            at: { type: string, format: date-time }
            hash: { type: string }
            items: { type: array, items: { type: integer } }
            by: { type: [string, 'null'] }
        - title: confirmed
          type: object
          additionalProperties: false
          required: [kind, at, hash, items]
          properties:
            kind: { const: confirmed }
            at: { type: string, format: date-time }
            hash: { type: [string, 'null'] }
            items: { type: array, items: { type: integer } }
        - title: failed or abandoned
          type: object
          additionalProperties: false
          required: [kind, at, hash, items, error]
          properties:
            kind: { enum: [failed, abandoned] }
            at: { type: string, format: date-time }
            hash: { type: [string, 'null'] }
            items: { type: array, items: { type: integer } }
            error: { oneOf: [{ type: 'null' }, { $ref: '#/components/schemas/Error' }] }
        - title: proposal_created
          type: object
          additionalProperties: false
          required: [kind, at, proposalId, chainRef, items]
          properties:
            kind: { const: proposal_created }
            at: { type: string, format: date-time }
            proposalId: { type: string }
            chainRef: { $ref: '#/components/schemas/ChainRef' }
            items: { type: array, items: { type: integer } }
        - title: proposal_approval
          type: object
          additionalProperties: false
          required: [kind, at, proposalId, state, approvals, threshold]
          properties:
            kind: { const: proposal_approval }
            at: { type: [string, 'null'], format: date-time }
            proposalId: { type: string }
            state: { type: string, enum: [awaiting, approved, approved_after_deadline] }
            approvals: { type: integer }
            threshold: { type: integer }
        - title: proposal_timed_out
          type: object
          additionalProperties: false
          required: [kind, at, proposalId]
          properties:
            kind: { const: proposal_timed_out }
            at: { type: string, format: date-time }
            proposalId: { type: string }
        - title: proposal_resolved
          type: object
          additionalProperties: false
          required: [kind, at, proposalId, outcome]
          properties:
            kind: { const: proposal_resolved }
            at: { type: string, format: date-time }
            proposalId: { type: string }
            outcome: { type: string, enum: [executed, rejected, failed] }

    ManagedDispatch:
      title: A Managed Dispatch
      type: object
      additionalProperties: false
      required: [dispatchId, mode, chain, createdAt, status, items]
      properties:
        dispatchId: { type: string, format: uuid }
        mode: { const: managed }
        chain: { $ref: '#/components/schemas/Chain' }
        sender: { $ref: '#/components/schemas/SenderRef' }
        createdAt: { type: string, format: date-time, description: When the engine stored it. }
        status: { $ref: '#/components/schemas/DispatchStatus' }
        items:
          type: array
          description: One entry per item, in the order you sent them. Each repeats what you asked for and adds its own outcome.
          items:
            oneOf:
              - $ref: '#/components/schemas/PaymentItem'
              - $ref: '#/components/schemas/CallItem'
        hold: { $ref: '#/components/schemas/Hold' }
        timeline:
          type: array
          description: Only with `include=timeline`.
          items: { $ref: '#/components/schemas/TimelineEntry' }

    RelayDispatch:
      title: A Relay Dispatch
      type: object
      additionalProperties: false
      required: [dispatchId, mode, chain, createdAt, status, transactionHash, error]
      properties:
        dispatchId: { type: string, format: uuid }
        mode: { const: relay }
        chain: { $ref: '#/components/schemas/Chain' }
        createdAt: { type: string, format: date-time }
        status:
          type: string
          enum: [queued, broadcasting, confirmed, failed, abandoned, cancelled]
        transactionHash: { type: [string, 'null'] }
        error: { oneOf: [{ type: 'null' }, { $ref: '#/components/schemas/Error' }] }
        timeline:
          type: array
          description: Only with `include=timeline`. The one transaction is item `0`.
          items: { $ref: '#/components/schemas/TimelineEntry' }

    DispatchRow:
      description: A Dispatch without its items, plus `itemCount` and `totals`.
      oneOf:
        - title: A Managed Dispatch row
          type: object
          additionalProperties: false
          required: [dispatchId, mode, chain, status, createdAt, itemCount, totals]
          properties:
            dispatchId: { type: string, format: uuid }
            mode: { const: managed }
            chain: { $ref: '#/components/schemas/Chain' }
            sender: { $ref: '#/components/schemas/SenderRef' }
            status: { $ref: '#/components/schemas/DispatchStatus' }
            createdAt: { type: string, format: date-time }
            itemCount: { type: integer }
            totals:
              type: array
              description: The sum per asset of the payment items. Call items carry no amount.
              items: { $ref: '#/components/schemas/AssetTotal' }
        - title: A Relay Dispatch row
          type: object
          additionalProperties: false
          required: [dispatchId, mode, chain, status, transactionHash, error, createdAt, itemCount, totals]
          properties:
            dispatchId: { type: string, format: uuid }
            mode: { const: relay }
            chain: { $ref: '#/components/schemas/Chain' }
            status: { type: string, enum: [queued, broadcasting, confirmed, failed, abandoned, cancelled] }
            transactionHash: { type: [string, 'null'] }
            error: { oneOf: [{ type: 'null' }, { $ref: '#/components/schemas/Error' }] }
            createdAt: { type: string, format: date-time }
            itemCount: { const: 1 }
            totals: { type: array, maxItems: 0 }

    DispatchPage:
      type: object
      additionalProperties: false
      required: [dispatches, nextCursor]
      properties:
        dispatches:
          type: array
          items: { $ref: '#/components/schemas/DispatchRow' }
        nextCursor:
          type: [string, 'null']
          description: Pass it as `cursor` for the next page. `null` on the last page, and only there.

    ReadError:
      type: object
      additionalProperties: false
      required: [error]
      description: A read that failed. Balance and threshold errors carry an error code, such as `RPC_UNAVAILABLE`.
      properties:
        error: { type: string }

    Sender:
      type: object
      additionalProperties: false
      required: [chain, name, default, network, mode, address, multisig, balances, signerKey]
      properties:
        chain: { $ref: '#/components/schemas/Chain' }
        name:
          type: string
          description: The Sender's configured name, the one `sender` takes on Create a Dispatch.
        default:
          type: boolean
          description: Whether a Dispatch on this chain that names no Sender pays from it.
        network:
          description: |
            The network the engine talks to, for explorer links. On Base, from `BASE_CHAIN_ID`:
            `base` for 8453, `base-sepolia` for 84532, and `{ "chainId": n }` for any other. On
            Solana, from the RPC's genesis hash: `mainnet-beta`, `devnet`, `testnet` or `unknown`.
          oneOf:
            - type: string
              enum: [base, base-sepolia, mainnet-beta, devnet, testnet, unknown]
            - type: object
              additionalProperties: false
              required: [chainId]
              properties:
                chainId: { type: integer }
        mode:
          type: string
          enum: [single, squads, safe]
          description: '`single` is a plain key. `squads` and `safe` are Multisig Senders.'
        address: { type: string, description: 'The Sender: the plain key, the Squads vault or the Safe.' }
        multisig:
          description: '`null` for `single`.'
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required: [address, threshold, engineKey]
              properties:
                address: { type: string, description: The Squads multisig account or the Safe. }
                threshold:
                  description: The approval threshold, as the chain reports it.
                  oneOf:
                    - type: integer
                    - $ref: '#/components/schemas/ReadError'
                engineKey: { type: string, description: The engine's own key, the Squads member key or the Safe executor. }
        balances:
          type: array
          description: The balances the Funding Check looks at.
          items:
            type: object
            additionalProperties: false
            required: [holder, address, assets]
            properties:
              holder:
                type: string
                enum: [sender, vault, memberKey, safe, executor]
                description: The same names `INSUFFICIENT_FUNDS` reports in `chainDetail.holder`.
              address: { type: string }
              assets:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [asset, balance, committed]
                  properties:
                    asset: { type: string }
                    decimals: { type: integer }
                    balance:
                      description: The balance in the smallest unit.
                      oneOf:
                        - $ref: '#/components/schemas/Amount'
                        - $ref: '#/components/schemas/ReadError'
                    committed:
                      $ref: '#/components/schemas/Amount'
                      description: What open Proposals and Calls waiting to be proposed already hold back. Always `0` for a plain Sender.
        signerKey:
          description: What the Signer reported about the key the engine signs with, as the worker last read it.
          oneOf:
            - title: Pins
              type: object
              additionalProperties: false
              required: [address, curve, readAt]
              properties:
                address: { type: string }
                curve: { type: string, enum: [secp256k1, ed25519] }
                chainIds: { type: array, items: { type: integer } }
                allowedSafe: { type: string }
                allowedMultisig: { type: string }
                readAt: { type: string, format: date-time }
            - title: A failed read
              type: object
              additionalProperties: false
              required: [error, readAt]
              properties:
                error:
                  type: string
                  enum:
                    - the Signer has no key for this address
                    - the Signer is too old to report a key policy
                    - the Signer could not be reached
                readAt: { type: string, format: date-time }
            - title: Not read yet
              type: object
              additionalProperties: false
              required: [status]
              properties:
                status: { const: not_read_yet }

    SenderList:
      type: object
      additionalProperties: false
      required: [senders]
      properties:
        senders:
          type: array
          items: { $ref: '#/components/schemas/Sender' }

    ReasonBody:
      type: object
      properties:
        reason:
          type: string
          minLength: 1
          description: Why, in your words. Kept in the activity record.

    AssetLimitDefinition:
      type: object
      required: [kind, asset, limit]
      properties:
        kind:
          type: string
          enum: [item_over, dispatch_total_over, daily_volume_over]
          description: |
            `item_over`: one payment item of `asset` is over `limit`. `dispatch_total_over`: the
            Dispatch's payment items of `asset` add up to more than `limit`. `daily_volume_over`: the
            payment items of `asset` in Managed Dispatches accepted in the last 24 hours and not
            cancelled, held ones included, plus this one's, add up to more than `limit`.
        asset: { type: string, description: An asset the engine knows on the rule's chain. }
        limit:
          type: string
          pattern: '^\d+(\.\d+)?$'
          description: Whole units of the asset, as a decimal string, such as `"5000"` or `"0.5"`. More than zero, and no more decimal places than the asset has.

    FirstTimeRecipientDefinition:
      type: object
      required: [kind]
      properties:
        kind:
          const: first_time_recipient
          description: A payment item's recipient has never had a confirmed payment from this engine on this chain.

    AllowlistDefinition:
      type: object
      required: [kind, addresses]
      properties:
        kind:
          type: string
          enum: [recipient_not_allowlisted, call_target_not_allowlisted]
          description: |
            `recipient_not_allowlisted`: a payment item's recipient is not in `addresses`.
            `call_target_not_allowlisted`: a call item's `to` (Base) or `programId` (Solana) is not in `addresses`.
        addresses:
          type: array
          items: { type: string }
          description: Addresses valid on the rule's chain. Base addresses come back checksummed.

    FlagRuleDefinition:
      description: What a rule matches. `kind` decides which parameters it takes, and it takes no others.
      oneOf:
        - $ref: '#/components/schemas/AssetLimitDefinition'
        - $ref: '#/components/schemas/FirstTimeRecipientDefinition'
        - $ref: '#/components/schemas/AllowlistDefinition'

    FlagRuleSenderName:
      type: [string, 'null']
      description: |
        The name of one Sender on the rule's chain, to check only the Dispatches it pays. Omitted or
        `null`, the rule checks every Sender on the chain.

    FlagRuleScope:
      description: |
        The one Sender the rule checks, or `null` for every Sender on its chain. The rule keeps the
        Sender's address, so `name` follows a rename, and is `null` when no configured Sender has
        the address any more.
      oneOf:
        - type: 'null'
        - type: object
          additionalProperties: false
          required: [name, address]
          properties:
            name: { type: [string, 'null'] }
            address: { type: string }

    FlagRuleCheck:
      type: object
      required: [chain, kind]
      allOf:
        - $ref: '#/components/schemas/FlagRuleDefinition'
      properties:
        chain: { $ref: '#/components/schemas/Chain' }
        sender: { $ref: '#/components/schemas/FlagRuleSenderName' }
        name: { type: string }
        enabled: { type: boolean }
        reason: { type: string }
      unevaluatedProperties: false

    FlagRuleRequest:
      type: object
      required: [name, chain, kind]
      allOf:
        - $ref: '#/components/schemas/FlagRuleDefinition'
      properties:
        name: { type: string, minLength: 1, description: A name for people. The console and the `hold` block show it. }
        chain: { $ref: '#/components/schemas/Chain' }
        sender: { $ref: '#/components/schemas/FlagRuleSenderName' }
        enabled: { type: boolean, default: true, description: A disabled rule is kept but matches nothing. }
        reason: { type: string, minLength: 1, description: Why, kept in the activity record. }
      unevaluatedProperties: false

    FlagRuleVersion:
      type: object
      required: [version, name, chain, sender, enabled, kind, createdAt]
      allOf:
        - $ref: '#/components/schemas/FlagRuleDefinition'
      properties:
        version: { type: integer, minimum: 1 }
        name: { type: string }
        chain: { $ref: '#/components/schemas/Chain' }
        sender: { $ref: '#/components/schemas/FlagRuleScope' }
        enabled: { type: boolean }
        createdAt: { type: string, format: date-time, description: When this version was written. }
      unevaluatedProperties: false

    FlagRule:
      type: object
      description: The current version at the top level, and every version, oldest first, in `versions`.
      required: [ruleId, version, name, chain, sender, enabled, kind, createdAt, updatedAt, deletedAt, versions]
      allOf:
        - $ref: '#/components/schemas/FlagRuleDefinition'
      properties:
        ruleId: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        name: { type: string }
        chain: { $ref: '#/components/schemas/Chain' }
        sender: { $ref: '#/components/schemas/FlagRuleScope' }
        enabled: { type: boolean }
        createdAt: { type: string, format: date-time, description: When version 1 was written. }
        updatedAt: { type: string, format: date-time, description: When the current version was written. }
        deletedAt: { type: [string, 'null'], format: date-time }
        versions:
          type: array
          items: { $ref: '#/components/schemas/FlagRuleVersion' }
      unevaluatedProperties: false

    FlagRulePreview:
      type: object
      additionalProperties: false
      required: [from, to, scanned, capped, wouldHold, examples]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        scanned: { type: integer, description: How many Dispatches in the window were checked. }
        capped: { type: boolean, description: '`true` when the window held more than one preview reads, so `wouldHold` is a lower bound.' }
        wouldHold: { type: integer, description: How many of them the rule matches. }
        examples:
          type: array
          maxItems: 10
          description: Up to 10 of the matched Dispatches, newest first.
          items:
            type: object
            additionalProperties: false
            required: [dispatchId, createdAt, items]
            properties:
              dispatchId: { type: string, format: uuid }
              createdAt: { type: string, format: date-time }
              items: { type: array, items: { type: integer }, description: The positions of the items the rule matched. }

    Hold:
      type: object
      additionalProperties: false
      required: [matched, heldAt]
      description: Only on a Dispatch that was ever held. It stays after a release or a cancel.
      properties:
        matched:
          type: array
          description: Every rule that matched, each with every item it matched.
          items:
            type: object
            additionalProperties: false
            required: [rule, ruleId, ruleVersion, items]
            properties:
              rule:
                type: object
                description: The rule as that version said when it matched.
                required: [name, kind]
                allOf:
                  - $ref: '#/components/schemas/FlagRuleDefinition'
                properties:
                  name: { type: string }
                unevaluatedProperties: false
              ruleId: { type: string, format: uuid }
              ruleVersion: { type: integer, minimum: 1 }
              items: { type: array, items: { type: integer }, description: Positions in `items`. }
        heldAt: { type: string, format: date-time }
        releasedAt: { type: string, format: date-time, description: Once it is released. }
        reason: { type: string, description: The reason the operator gave for the release. }

    OperatorAction:
      type: object
      additionalProperties: false
      required: [id, at, action, targetId, tokenKind, reason]
      properties:
        id: { type: string, format: uuid }
        at: { type: string, format: date-time }
        action:
          type: string
          enum:
            [
              cancel,
              release,
              flag_rule_create,
              flag_rule_update,
              flag_rule_delete,
              asset_add,
              asset_disable,
              asset_enable,
            ]
        targetId:
          { type: string, format: uuid, description: The Dispatch, Flag Rule or Known Asset acted on. }
        tokenKind:
          type: string
          enum: [auth, operator]
          description: Which token made the request.
        reason: { type: [string, 'null'], description: What the caller gave, or `null`. }

    KnownAsset:
      type: object
      additionalProperties: false
      required: [id, chain, address, symbol, name, decimals, kind, source, enabled, addedBy, addedAt]
      properties:
        id: { type: string, format: uuid }
        chain: { $ref: '#/components/schemas/Chain' }
        address: { type: string, description: 'The mint (Solana) or contract (Base, checksummed). `native` for the native coin.' }
        symbol: { type: string, description: What a payment item names in `asset`. Unique per chain among enabled assets, ignoring case. }
        name: { type: string, description: The token's name as the chain gives it, or its symbol when it gives none. }
        decimals: { type: integer, minimum: 0, maximum: 255, description: Read from the chain. }
        kind: { type: string, enum: [native, spl, token-2022, erc20] }
        source:
          type: string
          enum: [config, console]
          description: '`config` rows come from the configuration and can''t be changed here; `console` rows were added through the API.'
        enabled: { type: boolean, description: Whether a new payment may name it. }
        addedBy: { type: [string, 'null'], enum: [auth, operator, null], description: 'Which token added it; `null` for a config row.' }
        addedAt: { type: string, format: date-time }

    AssetRequest:
      type: object
      additionalProperties: false
      required: [chain, address]
      properties:
        chain: { $ref: '#/components/schemas/Chain' }
        address: { type: string, description: The mint or contract address. }
        symbol: { type: string, description: 'Replaces the chain''s symbol: 1 to 20 letters, digits, `.`, `_`, `$` or `-`.' }
        reason: { type: string, minLength: 1, description: Why, for the activity record. Add only. }

    AssetPreview:
      type: object
      additionalProperties: false
      required: [chain, kind, address, decimals, symbol, name, onChain, supply]
      properties:
        chain: { $ref: '#/components/schemas/Chain' }
        kind: { type: string, enum: [spl, token-2022, erc20] }
        address: { type: string }
        decimals: { type: integer, minimum: 0, maximum: 255 }
        symbol: { type: string, description: The symbol it would be added under. }
        name: { type: string }
        onChain:
          type: object
          additionalProperties: false
          required: [symbol, name]
          description: The name and symbol the chain gives, empty when it gives none.
          properties:
            symbol: { type: string }
            name: { type: string }
        supply: { type: string, pattern: '^\d+$', description: The total supply, in the smallest unit. }

    ActivityPage:
      type: object
      additionalProperties: false
      required: [actions, nextCursor]
      properties:
        actions:
          type: array
          items: { $ref: '#/components/schemas/OperatorAction' }
        nextCursor:
          type: [string, 'null']
          description: Pass it as `cursor` for the next page. `null` on the last page, and only there.

    SetupCheck:
      type: object
      required: [id, area, title, ranIn, ranAt, status, finding]
      properties:
        id: { type: string, description: 'The check, such as `signer.reachable`. A per-chain check ends in `:<chain>`.' }
        area:
          type: string
          enum: [configuration, database, chain, signer, sender, multisig, console]
        title: { type: string }
        chain: { $ref: '#/components/schemas/Chain' }
        ranIn:
          type: string
          enum: [worker, api]
          description: '`worker` checks are as the worker last recorded them, up to five minutes old. `api` checks ran on this request.'
        ranAt: { type: string, format: date-time }
        status: { type: string, enum: [pass, warn, fail] }
        finding: { type: string, description: What the check found, in one line. }
        fix:
          description: 'On a `warn` or a `fail`: a command to run, a setting to change, or a step to take outside this machine, such as funding an address.'
          oneOf:
            - type: object
              additionalProperties: false
              required: [command]
              properties: { command: { type: string } }
            - type: object
              additionalProperties: false
              required: [setting, value]
              properties: { setting: { type: string }, value: { type: string } }
            - type: object
              additionalProperties: false
              required: [step]
              properties: { step: { type: string } }
      oneOf:
        - properties: { status: { const: pass } }
          not: { required: [fix] }
        - properties: { status: { enum: [warn, fail] } }
          required: [fix]
      unevaluatedProperties: false

    SetupReport:
      type: object
      additionalProperties: false
      required: [worker, summary, checks]
      properties:
        worker:
          description: |
            `ran`, with the time of the worker's latest run. `not_run_yet` on a fresh install before
            the worker's first run, when `checks` holds only the API's own. `unreadable` when the
            database did not answer, and the API's `database.reachable` check then says why.
          oneOf:
            - type: object
              additionalProperties: false
              required: [status, ranAt]
              properties:
                status: { const: ran }
                ranAt: { type: string, format: date-time }
            - type: object
              additionalProperties: false
              required: [status]
              properties:
                status: { enum: [not_run_yet, unreadable] }
        summary:
          type: object
          additionalProperties: false
          required: [passed, warnings, problems]
          properties:
            passed: { type: integer }
            warnings: { type: integer }
            problems: { type: integer }
        checks:
          type: array
          items: { $ref: '#/components/schemas/SetupCheck' }

    SenderRef:
      type: object
      additionalProperties: false
      required: [name, address]
      description: |
        The Sender that pays, recorded when the Dispatch was accepted. `name` is its name in the
        current configuration, so renaming a Sender keeps its history, and `null` when no configured
        Sender has the address any more. Absent only on a Dispatch stored before named Senders, until
        the engine gives it to its chain's default Sender at startup. A Relay Dispatch has none.
      properties:
        name: { type: [string, 'null'] }
        address: { type: string, description: 'The plain key, the Squads vault or the Safe.' }
