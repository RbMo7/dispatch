<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" role="img" aria-labelledby="lifecycle-title" font-family="inherit">
  <title id="lifecycle-title">An item moves from queued to broadcasting to confirmed. A multisig item waits in awaiting_approval first. It can end cancelled, failed or abandoned instead.</title>
  <defs>
    <marker id="lifecycle-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L8 4 L0 8 z" style="fill: var(--muted)" />
    </marker>
  </defs>
  <g style="stroke: var(--border-strong); stroke-width: 1.5; fill: none" marker-end="url(#lifecycle-arrow)">
    <path d="M160 43 H304" />
    <path d="M120 56 L198 116" />
    <path d="M292 120 L352 61" />
    <path d="M450 43 H594" />
    <path d="M90 56 V194" />
    <path d="M380 56 V194" />
    <path d="M450 56 L632 194" />
  </g>
  <g style="fill: var(--muted)" font-size="11.5">
    <text x="232" y="34" text-anchor="middle">claimed, signed, sent</text>
    <text x="104" y="104" text-anchor="end">multisig:</text>
    <text x="104" y="118" text-anchor="end">proposed</text>
    <text x="336" y="104">approved,</text>
    <text x="336" y="118">executed</text>
    <text x="522" y="34" text-anchor="middle">landed</text>
    <text x="98" y="170">cancelled before</text>
    <text x="98" y="184">the claim</text>
    <text x="388" y="170">refused, reverted,</text>
    <text x="388" y="184">or expired 3 times</text>
    <text x="604" y="112">no answer in time</text>
    <text x="604" y="126">(Base, or a multisig</text>
    <text x="604" y="140">deadline)</text>
  </g>
  <g font-size="10.5" font-weight="500" letter-spacing="0.6" text-anchor="middle">
    <rect x="20" y="30" width="140" height="26" rx="13" style="fill: var(--pill-queued-bg)" />
    <text x="90" y="47" style="fill: var(--pill-queued-fg)">QUEUED</text>
    <rect x="165" y="120" width="140" height="26" rx="13" style="fill: var(--pill-awaiting_approval-bg)" />
    <text x="235" y="137" style="fill: var(--pill-awaiting_approval-fg)">AWAITING_APPROVAL</text>
    <rect x="310" y="30" width="140" height="26" rx="13" style="fill: var(--pill-broadcasting-bg)" />
    <text x="380" y="47" style="fill: var(--pill-broadcasting-fg)">BROADCASTING</text>
    <rect x="600" y="30" width="140" height="26" rx="13" style="fill: var(--pill-confirmed-bg)" />
    <text x="670" y="47" style="fill: var(--pill-confirmed-fg)">CONFIRMED</text>
    <rect x="20" y="200" width="140" height="26" rx="13" style="fill: var(--pill-cancelled-bg)" />
    <text x="90" y="217" style="fill: var(--pill-cancelled-fg)">CANCELLED</text>
    <rect x="310" y="200" width="140" height="26" rx="13" style="fill: var(--pill-failed-bg)" />
    <text x="380" y="217" style="fill: var(--pill-failed-fg)">FAILED</text>
    <rect x="600" y="200" width="140" height="26" rx="13" style="fill: var(--pill-abandoned-bg)" />
    <text x="670" y="217" style="fill: var(--pill-abandoned-fg)">ABANDONED</text>
  </g>
</svg>
